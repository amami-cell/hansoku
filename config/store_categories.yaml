# 店ごとの「品目区分」。
#
# FW の部門分類が粗い店（例: ルクアLargo は フード/ドリンク の2部門しかない）で、
# 商品名から売上構成のカテゴリに束ね直すためのルール。店の売上構成を
# ケーキ／パフェ／ジェラート… の単位で見て、その区分に販促をぶら下げる。
#
# 使い方: categories は上から順に見て、商品名に keywords のどれかが含まれたら
# その区分に入る（先に一致した区分が勝ち）。どれにも当たらない商品は other へ。
# 区分名は「部門名のみのカテゴリ」として並び、押すと商品詳細が出る。
#
# 月ごとのベースは店で異なるので、店ごとに categories を用意する。
stores:
  "1160":            # ルクアLargo（LARGO）
    name: ルクアLargo
    other: その他
    # FW区分見出し（"NN:名前" の名前部分）→ 品目区分。全商品グリッドに出ない内訳
    # （テイクアウトジェラートの風味選択など＝素の風味名）を、FW自身の区分で束ねる。
    # ここに載る見出しだけ商品名より優先。載らない見出しは従来どおり商品名で判定。
    groups:
      テイクアウトジェラート: ジェラート   # TOダブル/トリプルの風味選択（素の風味名）＋+50円風味
      TOシングル: ジェラート               # TOシングルの風味選択
      ジェラートドリンク: ドリンク         # 季節のジェラートドリンク＝飲み物
      アルコール: アルコール               # 14:アルコール＝酒（大人のレモンティー/サングリア/アイリッシュ等）
      紅茶: ドリンク                       # 13:紅茶＝単品ティー（アサイーベリー/アールグレイ/レモン等）
      400ドリンク: ドリンク                # 32:400ドリンク見出しでトップに残る単品（ジェラートドリンク等）を確実にドリンクへ
                                          # （"ジェラート"を含むと区分がジェラートに誤爆するのを見出しで上書き）
    # 0円サブ（選択メニュー内訳）の親メイン商品。FW区分見出し(NN:名前 の名前部分)→ メイン商品名。
    # サブは内訳表示のみ＝親・区分の「点数」には加算しない。サブに売上があれば親の「売上」にのみ+計上。
    # 親名が実在商品ならその下に、実在しなければ表示専用の親ノードを作って束ねる。
    zero_groups:
      フレンチトースト: フレンチトースト
      ジェラートサンデーシングル: サンデーシングル
      ジェラートサンデーダブル: サンデーダブル
      ジェラートサンデートリプル: サンデートリプル
      ケーキ: LARGOケーキプレート
      "300ドリンク": "【セット300円ドリンク】"
      "400ドリンク": "【セット400円紅茶】"
      テイクアウトジェラート: "TOジェラート（風味・全TO共通）"
      TOシングル: "TOジェラート（風味・全TO共通）"
      ランチドリンク: "【ランチのみ】セットドリンク"
      # 11:ソフトドリンク（P・…）は確認中。未マップのサブは暫定「その他の内訳」に自動集約。
    # FW区分見出しを持たず、売上つきでトップに出てしまう内訳を、商品名で親メインに畳む。
    # zero_groups と同じ挙動（親の売上にのみ+計上、点数は加算しない）。
    #   sub_products          … 商品名の完全一致（風味名など短い語の誤爆を避けるため完全一致）
    #   sub_products_contains … 商品名の部分一致（衝突しない接頭辞など。例 "SN)" 系の紅茶）
    sub_products:
      ピスタチオ: "TOジェラート（風味・全TO共通）"          # TOジェラートの風味内訳
      リッチミルク: "TOジェラート（風味・全TO共通）"
      "TOシングル ピスタチオ": "TOジェラート（風味・全TO共通）"
      "TOシングル リッチミルク": "TOジェラート（風味・全TO共通）"
      イチゴ増し: LARGOケーキプレート                        # プレートのトッピング増し（売上のみ合算）
      イチジク増し: LARGOケーキプレート
      マンゴー増し: LARGOケーキプレート
      スコーン単品: 2000ミニパフェ＆スコーンタルトセット     # セットのサブ（スコーン）
      ほうじ茶マカロン: 2000ミニパフェ＆スコーンタルトセット   # セットのサブ（0円焼き菓子）
      ペアリングリキュール無し: ペアリング                   # パフェの「ペアリング」内訳キー（数量無し）
      ペアリングリキュール有り: ペアリング
      ICE: その他の内訳                                     # サイズ選択キー（0円）→ その他へ
      HOT: その他の内訳
      "★P": Pドリンク                                       # 練習打ち系キー → Pドリンクへ
    sub_products_contains:
      "SN)": 2000ミニパフェ＆スコーンタルトセット            # セットのサブ（0円紅茶の選択）
      "P・": Pドリンク                                       # 練習打ち等の0円ドリンクを1メインに集約
      "フレンチ）": フレンチトースト                         # フレンチトーストのトッピング選択（全角括弧）
      "フレンチ)": フレンチトースト                          # 同（半角括弧）
      "T)": LARGOケーキプレート                             # ケーキのチケット選択（半角）→ プレートに合流
      "T）": LARGOケーキプレート                            # 同（全角）
      "SD)": 2000ミニパフェ＆スコーンタルトセット           # ソフトドリンクの0円選択 → アフタヌーンセット内訳へ
    # 見出しが zero_groups でも畳まずトップに残す商品（区分は商品名/groupで判定）。
    # セット券見出し(32:400ドリンク)に紛れる「ジェラートドリンク…」は実売れの飲料＝ドリンク区分で単品表示。
    no_nest_contains: [ジェラートドリンク]
    # 見出しの「売上0キーだけ」を親の内訳へ畳む（実売れ商品が同居する見出し用）。
    # 08:アフタヌーンセット＝2000セット本体・ミニパフェ無印・ティーフリー(実売れ)＋紅茶/スコーンの0円選択が同居。
    # 0円選択だけを 2000セット の内訳へ。実売れは単品のまま残す（本体/無印はフード、ティーフリーはドリンク）。
    zero_groups_zero_only:
      アフタヌーンセット: 2000ミニパフェ＆スコーンタルトセット
    # 商品名の完全一致で区分を上書き（"パフェ"等の誤爆を矯正）。
    name_category:
      "2000ミニパフェ＆スコーンタルトセット": フード
      "ミニパフェ＆スコーンタルトセット": フード
    # 指定親の内訳を小カテゴリで束ねて表示（上から判定・先勝ち／どれも当たらねば fallback）。
    sub_small_cat:
      "2000ミニパフェ＆スコーンタルトセット":
        order: [タルト・スコーン, 紅茶, ソフトドリンク]
        fallback: 紅茶
        rules:
          - {cat: ソフトドリンク, prefix: ["SD)"]}
          - {cat: 紅茶, contains: [紅茶]}
          - {cat: タルト・スコーン, contains: [スコーン, マカロン, タルト, アップルキャラメリゼ]}
    # 表示専用の束ね親で「点数＝サブ点数の合計」を数量に出す親（合計出数を1メインで見せる）。
    sub_qty_rollup: [Pドリンク]
    # 親ごとに、サブ名の接頭辞を落として同一風味を合算する（数量・売上とも合計）。
    sub_merge_prefixes:
      "TOジェラート（風味・全TO共通）": ["TOシングル "]
    categories:
      # 「フレンチ)〜」はフレンチトースト用の選択商品。TO/ジェラートより先にフードへ。
      - name: フード
        keywords: ["フレンチ)", フレンチトースト]
      - name: コラボ
        keywords: [コラボ, くまモン, くまもと, カエル, ピクルス, 白桃Days, ダックス]
      # 酒。FW見出し 14:アルコール で束ねる（groups で上書き）が、見出し欠けにも備えて
      # 商品名でも拾う。ラテ/アフタヌーン等に他区分より先に勝てるようドリンク/フードの上に置く。
      - name: アルコール
        keywords: [大人のレモンティー, ティーサングリア, アイリッシュ, アマレット, フランジェリコ,
                   モルツ, カリフォルニアウィンディ]
      # ドリンクなのに名前に「ジェラート」を含む商品（季節のジェラートドリンク等）は、
      # 下の「ジェラート」区分に誤爆させず、先にドリンクへ寄せる（TOジェラートにドリンクが
      # 混ざる不具合の対策）。ジェラートのフロート/ソーダ/ラテ等も飲み物としてドリンクへ。
      - name: ドリンク
        keywords: [ジェラートドリンク, ジェラートフロート, ジェラートソーダ, ジェラートラテ,
                   ジェラートスムージー, ジェラートシェイク,
                   ペアリングティー]   # 「ペアリング」でパフェに誤爆する単品ティーをドリンクへ（パフェ区分より先に判定）
      - name: ジェラート
        keywords: [ジェラート, TOジェラート, テイクアウトジェラート]
      - name: パフェ
        keywords: [パフェ, パフェス, サンデー, パルフェ, スノー, ペアリング,
                   苺とピスタチオのフレジェ, プリンアラモードとバナナのキャラメリゼ, ショコラオショコラ,
                   ペッシュ, ボクゥ]   # ペッシュエエールドラフェ / ボクゥ・デ・ペシェ（単品パフェ名）
      - name: ケーキ
        keywords: [ケーキ, タルト, フレジェ, ショコラ, バスク, モンブラン, ジュエル, プレート, プリンアラモード,
                   ミルクレープ, ロール, ミルフィーユ, トルテ, ザッハ, サンマルク, ベイクドアラスカ, アンヴタン, フレジエ]
      - name: ドリンク
        keywords: [ラテ, コーヒー, 珈琲, カフェ, ドリンク, ティー, 紅茶, ソーダ, ジュース, スムージー, フロート,
                   レモネード, ネード, モカ, アールグレイ, ダージリン, ゆずれもん,
                   # 単品売りの飲料・紅茶フレーバー（旧「その他」）。※風味名は他区分と衝突しない語のみ
                   コーラ, ジンジャー, ウーロン, モルツ, エスプレッソ, アイスチョコ,
                   アサイーベリー, フレッシュベリー, シトラスフルーツ, キャラメルナッツ, カリフォルニアウィンディ]
      - name: フード
        keywords: [トースト, クロックムッシュ, サンド, パスタ, カレー, ピザ, グラタン, オムライス, ホットドッグ,
                   ブレックファースト, アフタヌーン]

  # ══ 品目区分＝FWの部門そのまま（1:1）。イニシエート全FW店の基本方針（HQ 2026-09）══
  #   dept_as_category: 各FW部門を区分名にする（部門名＝区分名。先頭 "NN:" と 店タグ【…】は落とす）。
  #   dept_merge:  部門を別区分へ統合（例 すさび湯 肉寿司→寿司）。
  #   dept_rename: 部門名を改名（例 すさび湯 盛り合わせ→寿司盛り合わせ）。
  #   dept_other:  オペ用（ほぼ0円）の部門を その他 へ。
  #   ⚠ 金額が発生しているのに その他 に落ちる部門があれば、勝手に埋めず要相談。
  #   ※部門合計で束ねるため「白飯だけ別区分へ」等の“商品単位”の移動は不可。
  #   除外: 1160 ルクア(FW部門が2つだけ＝商品名ベースが必要)／1766 ぎふや福岡(FW未連動)。
  "1069": &fwdept
    name: ひよこ飯店
    other: その他
    classify_by: department
    dept_as_category: true
    # ※テイクアウト・サービスタイム(→タイムサービス) は独立区分にするため ここには入れない（HQ 2026-09）。
    dept_other: [＊コメント, コメント, ◆サブ, サブ, サブメニュー, サブメニュー用,
                 フードサブ, ドリンクサブ, 他部門, その他部門, その他, 持ち帰り, 持帰り,
                 サービス, サービス品, 出前, Fその他]
  "1097": { <<: *fwdept, name: ARATA }
  "1111": { <<: *fwdept, name: ちゃーちゃん }
  "1131": { <<: *fwdept, name: CRAFTMAN UMAMI }
  "1137": { <<: *fwdept, name: 料理と酒 たいだい }
  "1151": { <<: *fwdept, name: NagaGutsu }
  "1154": { <<: *fwdept, name: 熊の鳥焼 }
  "1162": { <<: *fwdept, name: 味のたぬきや }
  "1163": { <<: *fwdept, name: フレンチ酒場GOLD }
  "1168": { <<: *fwdept, name: GOLD京都ポルタ店 }
  "1713": { <<: *fwdept, name: 門真Largo }
  "1729": { <<: *fwdept, name: フレンチ酒場GOLDお初 }
  "1739": { <<: *fwdept, name: "ぎふや 天満橋店" }
  "2004": { <<: *fwdept, name: んだんだ }

  # ── すさび湯系（7店）：FW部門1:1 ＋ 肉寿司→寿司統合・盛り合わせ→寿司盛り合わせ改名 ──
  "1006": &sasabi
    <<: *fwdept
    name: すさび湯系
    dept_merge: { 肉寿司: 寿司 }
    dept_rename: { 盛り合わせ: 寿司盛り合わせ, サービスタイム: タイムサービス }
  "1015": { <<: *sasabi, name: すさび湯 歌舞伎町 }
  "1169": { <<: *sasabi, name: すさび湯三宮店 }
  "1712": { <<: *sasabi, name: すさび湯京都烏丸 }
  "1728": { <<: *sasabi, name: "すさび湯 天満橋店" }
  "1742": { <<: *sasabi, name: "すさび湯 京都三条店" }
  "1743": { <<: *sasabi, name: "すさび湯 新宿東口店" }
