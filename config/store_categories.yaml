# 店ごとの「品目区分」。
#
# FW の部門分類が粗い店（例: ルクアLargo は フード/ドリンク の2部門しかない）で、
# 商品名から売上構成のカテゴリに束ね直すためのルール。店の売上構成を
# ケーキ／パフェ／ジェラート… の単位で見て、その区分に販促をぶら下げる。
#
# 使い方: categories は上から順に見て、商品名に keywords のどれかが含まれたら
# その区分に入る（先に一致した区分が勝ち）。どれにも当たらない商品は other へ。
# 区分名は「部門名のみのカテゴリ」として並び、押すと商品詳細が出る。
#
# 月ごとのベースは店で異なるので、店ごとに categories を用意する。
stores:
  "1160":            # ルクアLargo（LARGO）
    name: ルクアLargo
    other: その他
    categories:
      - name: コラボ
        keywords: [コラボ, くまモン, くまもと, カエル, ピクルス, 白桃Days, ダックス]
      - name: ジェラート
        keywords: [ジェラート, TOジェラート, テイクアウトジェラート]
      - name: パフェ
        keywords: [パフェ, パフェス, サンデー, パルフェ, スノー]
      - name: ケーキ
        keywords: [ケーキ, タルト, フレジェ, ショコラ, バスク, モンブラン, ジュエル, プレート, プリンアラモード, ミルクレープ, ロール]
      - name: ドリンク
        keywords: [ラテ, コーヒー, カフェ, ドリンク, ティー, 紅茶, ソーダ, ジュース, スムージー, フロート]
      - name: フード
        keywords: [トースト, クロックムッシュ, サンド, パスタ, カレー, ピザ, グラタン, オムライス, ホットドッグ]
