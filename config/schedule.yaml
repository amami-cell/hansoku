  # ================================================================
  # シーズン販促（追加指示・2026秋冬）— 天さん指示。
  #   宴会/コース/食べ放題/デザートは FW ABC の「部門(bucket)」「商品(items)」に紐づけると、
  #   施策詳細に 実績・構成比・商品内訳（「表示」で展開）を自動表示する。
  #   bucket: コース/食べ放題/ランチ/アラカルト/飲み放題 のいずれか（該当部門の実績＋構成比）。
  #   items : 商品名キーワード配列（部分一致）。該当商品の実績＋部門内構成比を出す。
  #   ※期間・商品名は概算/未確定。正式が来たら差し替える。
  #   ※「1ヵ月毎（月次で並べる）」はABCの月次蓄積が要る（現状は最新1ヶ月のみ保持）。
  # ----------------------------------------------------------------
  # 全店 忘新年会（宴会）… 各店の bounenkai 施策（上記）で 宴会=コース部門 の実績・構成比が出る。
  #   忘新年会コースの商品内訳は、対象店の bounenkai 施策に items（コース名キーワード）を足すと
  #   「宴会内 構成比」付きで表示できる（正式なコース名待ち）。
  # ARATA クリスマスコース（1097）… 宴会=コース部門。コース内訳は items で（正式名称待ち）。
  - { id: r1097-xmas, stores: ["1097"], title: クリスマスコース, kind: dev, bucket: コース,
      start: "2026-12-01", end: "2026-12-25", note: "概算期間。宴会=コース部門で実績/構成比。コース内訳はitemsで（正式名称待ち）" }
  # 門真Largo 食べ放題（1713）… 食べ放題部門の実績・構成比を月ごとに追う。
  - { id: r1713-tabehodai, stores: ["1713"], title: 食べ放題（月次追跡）, kind: dev, bucket: 食べ放題,
      start: "2026-09-01", note: "通年想定。食べ放題部門の実績・構成比。月次で並べるには月次ABC蓄積が要る" }
  # ルクアLargo デザート（1160）… 月ごとに ケーキ/テイクアウトジェラート/おすすめパフェ の実績。
  #   既存: r1160-cake（ケーキ変更）・r1160-parfait（パフェ）。ジェラートを追加。
  #   items は正式な商品名が分かれば付ける（例 ["ジェラート"] で該当商品を拾う）。
  - { id: r1160-gelato, stores: ["1160"], title: テイクアウトジェラート, kind: dev, items: ["ジェラート"],
      start: "2026-09-01", note: "月次で実績を追う。商品名が確定したら items を調整" }

