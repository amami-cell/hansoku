  #   FW上の実際の商品名から引いた。確認できた店だけ入れてある:
  #     1006 忘年会(刺身)4500円 / 忘年会コース(鍋)4500円 / 新年会(刺身)4500円
  #     1069 【ﾋﾖｺ】忘年会コース   1097 忘新年会コース5000 / 4500
  #     1162 忘年会コース)4500円   1163 5500忘新年会コース / 忘新年会飲み放題
  #     1728 忘年会コース(刺身)    1742 忘年会コース
  #   ※1728は年間計画表に忘年会の行が無かったが、実施ありと確認して追加した。
  #   それ以外の店は前年に「忘年会」と名の付く商品が無く（通常コースで受けている）、
  #   items を置くと取りこぼすので bucket=コース の集計だけにしてある。
  #   今年の名前が決まったら abc-detail で確かめて足すこと（想像で書かない）。
  - { id: r1097-xmas, stores: ["1097"], title: クリスマスコース（10月下旬打ち出し）, kind: dev,
