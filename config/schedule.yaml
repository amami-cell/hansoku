  #   ※「1ヵ月毎（月次で並べる）」はABCの月次蓄積が要る（現状は最新1ヶ月のみ保持）。
  # ----------------------------------------------------------------
  # 全店 忘新年会（宴会）… 各店の bounenkai 施策（上記）で 宴会=コース部門 の実績・構成比が出る。
