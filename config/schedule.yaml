  #   宴会/コース/食べ放題/デザートは FW ABC の「部門(bucket)」「商品(items)」に紐づけると、
  #   施策詳細に 実績・構成比・商品内訳（「表示」で展開）を自動表示する。
  #   bucket: コース/食べ放題/ランチ/アラカルト/飲み放題 のいずれか（該当部門の実績＋構成比）。
  #   items : 商品名キーワード配列（部分一致）。該当商品の実績＋部門内構成比を出す。
