  # ルクアLargo デザート（1160）… 月ごとに ケーキ/ジェラート/おすすめパフェ の実績。
  #   既存: r1160-cake（ケーキ変更）・r1160-parfait（パフェ）。ジェラートは通年の販促枠。
  #   bucket は店の区分名『ジェラート』に合わせる（TOジェラートもこの区分に束ねている）。
  #   TOジェラートは毎回2品が販促＝風味が毎月ローテ。items は固定しない（"ジェラート"を入れると
  #   定番のスクープ本体 TOジェラート ダブル/シングル/トリプル まで拾ってしまうため）。
  #   毎月の“限定フレーバー”（直近6か月で抜けのある品）を限定判定で自動マークする。
  - { id: r1160-gelato, stores: ["1160"], title: ジェラート（TO・毎回2品ローテ）, kind: dev, bucket: ジェラート,
      start: "2024-01-01", end: "2027-12-31",
