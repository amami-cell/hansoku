# 販促・出来事スケジュール（人が入れる入力のひとつ）
# ============================================================
# ここに書いた施策・出来事が、画面トップの「全店スケジュール」に帯で並びます。
# このファイルは Git で管理されるので、そのまま販促履歴のバックアップになります。
#
# 1件の書き方:
#   - id:     好きな一意の文字列（重複しなければ何でも）
#     stores: 対象店の store_code の配列。全店なら "all"（または省略）
#     title:  帯に出す名前
#     kind:   種類。色分けに使う。次のどれか:
#               fair     … フェア・催事           (橙)
#               menu     … 新メニュー・切替       (緑)
#               promo    … 販促・キャンペーン     (藍)
#               renewal  … 改装明け・リニューアル (藍・強)
#               closure  … 休業・改装中           (灰)
#               switch   … 設備変更（ダクト/喫煙可/改装など） (紫)
#     start:  開始日 "YYYY-MM-DD"
#     end:    終了日 "YYYY-MM-DD"（単日イベントは start と同じ日にする）
#     note:   補足（任意）
#
# store_code の一覧は config/stores.yaml を参照。
# ------------------------------------------------------------
# ↓ いまは動作確認用のサンプルです（title を「（例）」で始めています）。
#   実際の施策を入れるときは、この4件を消して本物を追記してください。

campaigns:
  - id: ex-beer-fair
    stores: ["1006"]
    title: （例）夏のビールフェア
    kind: fair
    start: "2026-08-05"
    end: "2026-08-25"
    note: 動作確認用のサンプル。実施策に置き換えてください。

  - id: ex-new-menu
    stores: ["2004"]
    title: （例）新グランドメニュー切替
    kind: menu
    start: "2026-08-18"
    end: "2026-09-05"
    note: 動作確認用のサンプル。

  - id: ex-autumn-promo
    stores: "all"
    title: （例）秋の宴会予約キャンペーン
    kind: promo
    start: "2026-09-01"
    end: "2026-09-20"
    note: 全店対象のサンプル。scope 全店の見え方の確認用。

  - id: ex-kyoto-renewal
    stores: ["1168"]
    title: （例）リニューアルOPEN
    kind: renewal
    start: "2026-08-11"
    end: "2026-08-11"
    note: 単日イベント（マーカー表示）のサンプル。
