# 販促・出来事スケジュール（人が入れる入力のひとつ）
# ============================================================
# ここに書いた施策・出来事が、画面トップの「全店スケジュール」に帯で並びます。
# このファイルは Git で管理されるので、そのまま販促履歴のバックアップになります。
#
# 1件の書き方:
#   - id:     好きな一意の文字列（重複しなければ何でも）
#     stores: 対象店。store_code の配列でも、店名の配列でもよい（例 ["1006"] / ["すさび湯 三宮"]）。
#             全店なら "all"（または省略）。実在しない店は黙って捨てる。
#     title:  帯に出す名前
#     kind:   種類（色分け）。計画表の語彙に対応:
#               gm        … GM改定        (紫)
#               lunch     … ランチ変更     (青)
#               osusume   … 夏/秋おすすめ  (橙)
#               bounenkai … 忘年会         (藍)
#               dev       … その他開発（ケーキ/パフェ/コラボ/クリスマス等）(緑)
#               closure   … 休業・改装中   (灰)
#     start:  開始日 "YYYY-MM-DD"
#     end:    終了日 "YYYY-MM-DD"（単日イベントは start と同じ日 or 省略でマーカー表示）
#     note:   補足（任意）
#
# ------------------------------------------------------------
# ▼ これは「2026 年間販売計画表（実行計画 11月末迄＋2026忘年会）」からの
#   下書き転記です（画面共有からの読み取り）。日付は概算で置いた箇所があります:
#     「◯月中旬」→15日 / 「◯月上旬・初旬」→5日 / 「◯月下旬」→25日 / 「◯月」「◯月中」→1日
#   実際の日付・内容は、この下を直接直すか、私に指示をください。
#   （恒久的には、この Google スプレッドシートを直接取り込む形にできます）

