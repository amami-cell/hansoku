# ============================================================
# 店舗マスタ（m_stores のシード）
#
# store_code は「FW（Foodist Journal）の店舗コード」。
#   FW共有シートの店名は "0001015_すさび湯 歌舞伎町" のように
#   先頭7桁のゼロ埋めコードを含んでおり、それを正規化したもの。
#   実績データの結合キーはこれ。
#
# ⚠ インフォマートは別のコード体系を使っている。
#   例: 熊の鳥焼 は FW=1154 / インフォマート=922。
#   24店中11店で番号が食い違うため、混同すると別の店の数字が混ざる。
#   原価・仕入をインフォマートから取り込むときは infomart_code の方で突き合わせること。
#
# store_name   : 表示用の店名
# source_name  : FW共有シートB列に現れる生の値（コード付き）
# infomart_code: インフォマート側の店舗コード。未出店・未登録なら空
# brand        : ブランドコード。スケジュール画面の色分けの単位
# is_shared_facility : 商業施設内の共営店舗フラグ
# active       : 閉店・休止で false にすると集約ループから外れる
#
# 新店を増やすときは、ここに1ブロック足すだけで取り込み対象に入る。
# ============================================================
