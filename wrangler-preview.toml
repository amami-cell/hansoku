# 公開プレビュー（認証なし・誰でも開ける）。本番 hansoku とは別 Worker で、
# Cloudflare Access を付けていないので前段のサインインが無い。
# 本番と同じ Worker コード（/api/* と /creatives/* も動く）＝POP・目標・メモも出る。
# データはデプロイ時に本番Neonから生成して同梱。全店の実データが載る点に注意。
# 不要になったら `wrangler delete --name hansoku-preview` で消す。
name = "hansoku-preview"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 制作物（POP）の実体は本番と同じ R2 バケットから返す。
[[r2_buckets]]
binding = "CREATIVES"
bucket_name = "hansoku-creatives"

# 入口＝合言葉ログイン（お名前＋合言葉）。前段に Cloudflare Access が無いので、
# 店長はこの URL に お名前＋合言葉 だけで入れる（編集も可）。データ・POPは本番Neon/R2。
#   "0" = 合言葉ログイン必須（いまはこれ）／ "1" = 誰でも閲覧の開放モード。
# OWNER_NAME はオーナー（管理権限）の表示名。
[vars]
OPEN_ACCESS = "0"
OWNER_NAME = "天見 真悟"
