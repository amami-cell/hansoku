# Cloudflare Workers で画面を配信する設定（本番 hansoku・Access保護）。
#
# 静的アセット（web/）の配信に加えて、販促目標の読み書きAPI（/api/targets）を
# Worker コード（worker/index.js）で捌く。目標は Neon に保存する。
# API は Cloudflare Access の内側にあるので、ログインした本人だけが書き込める。
#
# デプロイ前に `npm install` して @neondatabase/serverless を用意し、
# Worker の秘密 DATABASE_URL に Neon 接続文字列を入れておくこと（deploy.yml 参照）。

name = "hansoku"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker が /api/* と /creatives/* を捌き、それ以外は env.ASSETS で静的配信する。
[assets]
directory = "./web"
binding = "ASSETS"
# SPA。未知のパスは index.html を返す（今は単一ページだが将来のルーティングに備える）
not_found_handling = "single-page-application"

# 制作物PDFの置き場（Cloudflare R2）。/creatives/* を Worker がここから返す。
# バケットは deploy.yml が無ければ作る（冪等）。
[[r2_buckets]]
binding = "CREATIVES"
bucket_name = "hansoku-creatives"

# 開放モード（ログイン無し）。合言葉を外して誰でも入れる。
#   1 = 開放（全店の実売上がURLだけで見える）／ 消す or "0" = 個人ログイン必須に戻す。
# OWNER_NAME = アカウント管理（権限変更・パスワード初期化）ができるオーナーの表示名。
[vars]
OPEN_ACCESS = "1"
OWNER_NAME = "天見 真悟"
