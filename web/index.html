<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>販促マネジメント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandline">
      <div class="eyebrow">HASSIN／イニシエート</div>
      <h1>販促マネジメント</h1>
    </div>
    <div class="today">
      <span id="today"></span>
      <button class="tbtn" id="themebtn" type="button">表示切替</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="エリア"></nav>

  <div class="controls">
    <label for="metricsel">指標</label>
    <select id="metricsel"></select>
  </div>

  <main id="app">
    <div class="empty">データを読み込んでいます…</div>
  </main>

  <section style="margin-bottom:0">
    <div class="notice" id="notice"></div>
  </section>
</div>

<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
