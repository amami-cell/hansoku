name: dump-store
# 1店ぶんの「画面に出せる材料」を棚卸しする（読み取りのみ）。
on:
  workflow_dispatch:
    inputs:
      store:
        description: "店コード（既定 1160=ルクアLargo）"
        required: false
        default: "1160"
      months:
        description: "商品上位を出す月（カンマ区切り YYYY-MM）"
        required: false
        default: "2025-09,2025-10,2025-11"
      probe:
        description: "正体を追う商品名（カンマ区切り・部分一致）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 依存をインストール
        run: pip install -r requirements.txt
      - name: 棚卸し
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORE: ${{ github.event.inputs.store }}
          MONTHS: ${{ github.event.inputs.months }}
          PROBE_NAME: ${{ github.event.inputs.probe }}
        run: |
          set -o pipefail
          python scripts/dump_store.py | tee -a "$GITHUB_STEP_SUMMARY"
