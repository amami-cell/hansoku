name: winter-osusume

# 前年の「冬のオススメ」料理を配信中の dashboard.json から拾う（読み取りのみ）。
#  - products_monthly[店][月] の各商品が持つ FW メニュー見出し group（例「おすすめ」）で束ねる。
#  - 対象月は winter（既定 2025-12,2026-01,2026-02）と、比較用に今年の秋（2026-09,2026-10）も見る。
#  - 全店ぶんの「見出し一覧」「おすすめ見出しの商品（出数・売上・構成比）」を
#    データ用ブランチ(claude/winter-osusume-data)の winter/ に JSON と Markdown で push する。
#  - 速報は ::notice:: 注釈にも出す（手元から run の check-runs API で読めるように）。

on:
  workflow_dispatch:
    inputs:
      url:
        description: "対象URL"
        required: false
        default: "https://hansoku-app.amami-c1e.workers.dev/"
      winter_months:
        description: "前年の冬の月（カンマ区切り YYYY-MM）"
        required: false
        default: "2025-12,2026-01,2026-02"
      compare_months:
        description: "比較に見る月（今年の秋など・カンマ区切り）"
        required: false
        default: "2025-11,2026-09,2026-10"

permissions:
  contents: write

env:
  TZ: Asia/Tokyo

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 配信JSONから冬オススメを抽出
        env:
          U: ${{ inputs.url }}
          WM: ${{ inputs.winter_months }}
          CM: ${{ inputs.compare_months }}
        run: |
          set -o pipefail
          URL="${U%/}"
          curl -sS "$URL/data/dashboard.json" -o d.json
          echo "dashboard.json bytes=$(wc -c < d.json | tr -d ' ')"
          python3 - <<'PY'
          import os, json, re, csv

          d = json.load(open("d.json", encoding="utf-8"))
          winter = [x.strip() for x in os.environ.get("WM","").split(",") if x.strip()]
          compare = [x.strip() for x in os.environ.get("CM","").split(",") if x.strip()]
          all_months = winter + compare

          stores = d.get("stores", []) or []
          name_of  = {s["code"]: s.get("name","") for s in stores}
          brand_of = {s["code"]: (s.get("brand_name") or s.get("brand") or "") for s in stores}
          # 表示順：stores の並び（地域順）
          order = [s["code"] for s in stores]

          pm = d.get("products_monthly", {}) or {}

          def glabel(g):
              if not g: return ""
              return re.sub(r"^\s*\d+\s*[:：]\s*", "", str(g)).strip()

          OSUSUME_KW = ("おすすめ","オススメ","お勧め","お薦め","季節","旬","冬","フェア","限定","新")

          def is_osusume(label):
              return any(k in label for k in OSUSUME_KW)

          # 店ごと・月ごとに group で束ねる
          # result[code] = {
          #   "name","brand",
          #   "months": { m: { "store_sales": float,
          #                    "groups": { label: {"sales","qty","count","items":[{name,sales,qty}]} } } }
          # }
          result = {}
          for code, months in pm.items():
              entry = {"name": name_of.get(code, code), "brand": brand_of.get(code,""), "months": {}}
              for m in all_months:
                  items = months.get(m)
                  if not items:
                      continue
                  store_sales = sum((p.get("sales") or 0) for p in items)
                  groups = {}
                  for p in items:
                      lab = glabel(p.get("group")) or "（見出しなし）"
                      g = groups.setdefault(lab, {"sales":0.0,"qty":0,"count":0,"items":[]})
                      g["sales"] += (p.get("sales") or 0)
                      g["qty"]   += (p.get("qty") or 0)
                      g["count"] += 1
                      g["items"].append({"name":p.get("name",""),
                                         "sales":round(p.get("sales") or 0),
                                         "qty":round(p.get("qty") or 0)})
                  for g in groups.values():
                      g["sales"] = round(g["sales"])
                      g["items"].sort(key=lambda x:(-x["sales"], -x["qty"]))
                  entry["months"][m] = {"store_sales": round(store_sales), "groups": groups}
              if entry["months"]:
                  result[code] = entry

          os.makedirs("winter", exist_ok=True)
          with open("winter/last_winter_osusume.json","w",encoding="utf-8") as f:
              json.dump({"winter_months":winter,"compare_months":compare,"stores":result},
                        f, ensure_ascii=False, indent=1)

          # ---- 冬の集計（winter の月を合算）：おすすめ系見出しの商品を店別に ----
          # md とCSVに出す
          md = []
          md.append(f"# 前年 冬のオススメ（{winter[0]}〜{winter[-1]}）店別抽出\n")
          md.append("FW メニュー見出し(group)が「おすすめ/季節/旬/フェア/限定/新」等を含む区分を"
                    "『オススメ系』として束ねました。売上は税抜、構成比は各月その店の全商品売上に対する比。\n")

          csv_rows = [["店コード","店名","業態","見出し","商品名",
                       "冬売上(税抜)","冬出数","月別売上(winter)"]]

          def kv_months(dct):
              return " ".join(f"{m[5:]}月{dct.get(m,0):,}" for m in winter if dct.get(m))

          any_osusume_overall = False
          for code in order:
              e = result.get(code)
              if not e:
                  continue
              # winter 月の group を合算
              agg = {}   # label -> {sales,qty, items:{name->{sales,qty,months:{m:sales}}}}
              store_sales_w = 0
              present = [m for m in winter if m in e["months"]]
              for m in present:
                  mm = e["months"][m]
                  store_sales_w += mm["store_sales"]
                  for lab, g in mm["groups"].items():
                      a = agg.setdefault(lab, {"sales":0,"qty":0,"items":{}})
                      a["sales"] += g["sales"]; a["qty"] += g["qty"]
                      for it in g["items"]:
                          ai = a["items"].setdefault(it["name"], {"sales":0,"qty":0,"months":{}})
                          ai["sales"] += it["sales"]; ai["qty"] += it["qty"]
                          ai["months"][m] = ai["months"].get(m,0) + it["sales"]
              osu = {lab:a for lab,a in agg.items() if is_osusume(lab)}
              md.append(f"\n## {code} {e['name']}（{e['brand']}）")
              if not present:
                  md.append(f"- 冬の月データなし（{'/'.join(winter)} いずれも未取込）")
                  continue
              md.append(f"- 冬の対象月: {', '.join(present)} / 店の全商品売上合計(税抜) {store_sales_w:,}")
              # 見出し一覧（上位）
              inv = sorted(agg.items(), key=lambda kv:-kv[1]["sales"])
              md.append("- 見出し一覧（売上順）: " +
                        " / ".join(f"{lab}:{a['sales']:,}" for lab,a in inv[:14]))
              if not osu:
                  md.append("- **オススメ系の見出しは検出されず**（この店は季節オススメを別見出しで出していない可能性）")
                  continue
              any_osusume_overall = True
              for lab, a in sorted(osu.items(), key=lambda kv:-kv[1]["sales"]):
                  share = (a["sales"]/store_sales_w*100) if store_sales_w else 0
                  md.append(f"- **見出し「{lab}」** 冬合計 売上 {a['sales']:,} / 出数 {a['qty']:,}"
                            f"（店内構成比 {share:.1f}%・{len(a['items'])}品）")
                  its = sorted(a["items"].items(), key=lambda kv:-kv[1]["sales"])
                  for nm, ai in its:
                      gi_share = (ai["sales"]/a["sales"]*100) if a["sales"] else 0
                      md.append(f"    - {nm} … 売上 {ai['sales']:,} / 出数 {ai['qty']:,}"
                                f"（見出し内 {gi_share:.0f}%）[{kv_months(ai['months'])}]")
                      csv_rows.append([code, e["name"], e["brand"], lab, nm,
                                       ai["sales"], ai["qty"], kv_months(ai["months"])])

          with open("winter/last_winter_osusume.md","w",encoding="utf-8") as f:
              f.write("\n".join(md)+"\n")
          with open("winter/last_winter_osusume.csv","w",encoding="utf-8",newline="") as f:
              csv.writer(f).writerows(csv_rows)

          # ---- 速報 notices ----
          # 1) データのある冬月／全店の見出し有無サマリ
          cov = []
          for code in order:
              e = result.get(code)
              if not e: continue
              present = [m for m in winter if m in e["months"]]
              has_osu = False
              aggp = {}
              for m in present:
                  for lab,g in e["months"][m]["groups"].items():
                      if is_osusume(lab): has_osu = True
              cov.append(f"{code}{e['name']}:{'/'.join(x[5:] for x in present) or 'なし'}{'★' if has_osu else ''}")
          print(f"::notice title=冬データ網羅(★=おすすめ見出し有):: " + " ".join(cov))

          # 2) 見出し一覧（店別・上位）を分割
          def emit_batches(title, lines, cap=5500):
              buf=""; part=0
              for ln in lines:
                  if len(buf)+len(ln)+3>cap:
                      part+=1; print(f"::notice title={title}{part:02d}::{buf}"); buf=""
                  buf += ln + " ／ "
              if buf:
                  part+=1; print(f"::notice title={title}{part:02d}::{buf}")

          inv_lines=[]
          for code in order:
              e=result.get(code)
              if not e: continue
              present=[m for m in winter if m in e["months"]]
              if not present: continue
              agg={}
              for m in present:
                  for lab,g in e["months"][m]["groups"].items():
                      agg[lab]=agg.get(lab,0)+g["sales"]
              inv=sorted(agg.items(),key=lambda kv:-kv[1])[:10]
              inv_lines.append(f"[{code}{e['name']}] " + " ".join(f"{l}:{v:,}" for l,v in inv))
          emit_batches("冬の見出し一覧", inv_lines)

          # 3) おすすめ系見出しの商品（店別）
          osu_lines=[]
          for code in order:
              e=result.get(code)
              if not e: continue
              present=[m for m in winter if m in e["months"]]
              if not present: continue
              agg={}
              for m in present:
                  for lab,g in e["months"][m]["groups"].items():
                      if not is_osusume(lab): continue
                      a=agg.setdefault(lab,{"sales":0,"qty":0,"items":{}})
                      a["sales"]+=g["sales"]; a["qty"]+=g["qty"]
                      for it in g["items"]:
                          ai=a["items"].setdefault(it["name"],{"sales":0,"qty":0})
                          ai["sales"]+=it["sales"]; ai["qty"]+=it["qty"]
              if not agg: continue
              for lab,a in agg.items():
                  top=sorted(a["items"].items(),key=lambda kv:-kv[1]["sales"])[:8]
                  osu_lines.append(f"[{code}{e['name']}/{lab} 計{a['sales']:,}/{a['qty']}点] " +
                                   " ".join(f"{n}:{v['sales']:,}({v['qty']})" for n,v in top))
          if osu_lines:
              emit_batches("冬オススメ商品", osu_lines)
          else:
              print("::notice title=冬オススメ商品::おすすめ系見出しは全店で検出されず（名前ベース抽出に切替要）")
          PY

      - name: データ用ブランチへ push
        run: |
          set -e
          git config user.name "hansoku-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B claude/winter-osusume-data
          git add -f winter/
          git commit -m "winter osusume snapshot (読み取り結果)" || echo "no changes"
          for i in 1 2 3 4; do
            git push -f -u origin claude/winter-osusume-data && break
            echo "push retry $i"; sleep $((2**i))
          done
