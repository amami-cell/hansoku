name: import-pops
# config/creatives_inbox.tsv の Drive公開POPを R2 とNeon(promo_creatives)へ直接取り込む。
# Worker は Cloudflare Access の内側なのでサーバー越しPOSTは302される。
# R2(S3 API)とNeonへ直接書けば Access を通らず、アプリ内アップロードと同じ形で残る。
on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存をインストール
        run: pip install -r requirements.txt
      - name: POPを取り込む
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/import_pop_inbox.py
