name: 0の実績を消す

# 開店前の月などに入ってしまった「0」を片付けるための手動ワークフロー。
#
# ⚠️ **既定は素振り。** apply を true にしたときだけ本当に消す。
# ⚠️ **source は必ず指定する。** 空だと全ソースの0が対象になりかねないので、
#    CLI 側で必須にしてある（未指定なら落ちる）。
# ⚠️ **再取込では消えない。** replace_actuals は「渡した行が覆う範囲」しか
#    削除しないので、0を作らなくなった月は削除範囲にも入らない。だからこれが要る。

on:
  workflow_dispatch:
    inputs:
      source:
        description: '取り込み口（例 pos_sheet）。必須'
        required: true
        default: 'pos_sheet'
      store:
        description: '店舗コード（カンマ区切り。空なら全店）'
        required: false
        default: ''
      metric:
        description: '指標（カンマ区切り。空なら全指標）'
        required: false
        default: ''
      date_from:
        description: '開始日 YYYY-MM-DD（空なら制限なし）'
        required: false
        default: ''
      date_to:
        description: '終了日 YYYY-MM-DD（空なら制限なし）'
        required: false
        default: ''
      apply:
        description: '**本当に消す**（false のままなら素振りで一覧を出すだけ）'
        type: boolean
        default: false

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 0を消す（既定は素振り）
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # load_settings() は R2 まで必須にしている。この処理では使わないが、
          # 渡さないと設定の読み込みで落ちる（他のワークフローと同じ顔ぶれ）。
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args="--source '${{ inputs.source }}'"
          for s in $(echo "${{ inputs.store }}" | tr ',' ' '); do
            [ -n "$s" ] && args="$args --store $s"
          done
          for m in $(echo "${{ inputs.metric }}" | tr ',' ' '); do
            [ -n "$m" ] && args="$args --metric $m"
          done
          [ -n "${{ inputs.date_from }}" ] && args="$args --date-from ${{ inputs.date_from }}"
          [ -n "${{ inputs.date_to }}" ] && args="$args --date-to ${{ inputs.date_to }}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            args="$args --apply"
          fi
          # ⚠️ **`{ … } | tee` の中で走らせない。** それだと最後の echo の結果が
          # ジョブの成否になり、**中のコマンドが落ちてもジョブは緑**になる。
          # 消す操作でこれをやると「消えたつもり」が起きる。先に実行して
          # 終了コードを取り、そのあとでサマリに流す。
          set +e
          out="$(eval python -m hansoku.cli purge-zeros $args 2>&1)"
          rc=$?
          set -e
          # 結果はジョブのサマリにも残す（ログを掘らなくても読める）
          {
            echo '## 0の実績'
            echo ''
            echo "apply: \`${{ inputs.apply }}\` / 終了コード: \`$rc\`"
            echo ''
            echo '```'
            echo "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
