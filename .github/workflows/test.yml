name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# トークンは読み取りだけでよい（どのワークフローも push もコメントもしない）。
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Neon のスキーマは配列・JSONB・CHECK 制約を使うため、実PostgreSQL で検証する。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hansoku_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 台帳の検査
        # 唯一の人力入力なので、間違えた書き方が黙って消える前にここで止める。
        # DBもFWも要らない。
        run: python -m hansoku.cli schedule-lint

      - name: 画面側の計算テスト（ブラウザ不要）
        run: |
          node --check web/app.js
          node tests/web/app_test.mjs

      - name: テスト
        env:
          HANSOKU_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hansoku_test
        run: python -m pytest tests/ -q
