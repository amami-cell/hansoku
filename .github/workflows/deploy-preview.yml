name: 確認用プレビューを公開

# 公開URL（Cloudflare Access なし）。本番と同じ画面・同じ実データ・同じ個人ログインを配る。
# 本番(hansoku)は前段に Cloudflare Access が残っており社外の管理画面操作が要るため、
# こちらを「実運用URL」として使う。毎晩、本番と同じ本番Neonからデータを作り直して反映する。

on:
  workflow_dispatch:
  schedule:
    # 毎日 11:10 JST (= 02:10 UTC)。本番(deploy.yml 02:00)の直後に走らせ、
    # 同じ本番Neonからデータを作り直して公開プレビューにも反映する。
    - cron: '10 2 * * *'

# トークンは読み取りだけでよい（どのワークフローも push もコメントもしない）。
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: データを書き出す
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m hansoku.cli export-web \
            --date-from 2023-01-01 --date-to 2026-12-31 --out web/data

      - name: 依存（worker用 npm）をインストール
        run: npm install

      - name: Cloudflare へ公開（プレビュー・認証なし）
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          COOKIE_SECRET: ${{ secrets.HANSOKU_COOKIE_SECRET }}
          APP_PASSWORD: ${{ secrets.HANSOKU_APP_PASSWORD }}
        run: |
          set -o pipefail
          TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]\"'"'")"
          ACCOUNT="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]\"'"'")"
          npm install -g wrangler@4
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"
          npx wrangler deploy --config wrangler-preview.toml 2>&1 | tee /tmp/wr.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wr.log | head -1 || true)
          # /api/*（POP一覧・目標・メモ）を動かすため、プレビューWorkerにも DATABASE_URL を入れる
          if [ -n "$NEON_DATABASE_URL" ]; then
            printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL --config wrangler-preview.toml 2>&1 | tail -2 || \
              echo "::warning::preview DATABASE_URL の設定に失敗"
          fi
          if [ -n "$COOKIE_SECRET" ]; then
            printf '%s' "$COOKIE_SECRET" | npx wrangler secret put COOKIE_SECRET --config wrangler-preview.toml 2>&1 | tail -2 || true
          fi
          # 参加コード（8888）。個人ログイン/初回登録のテストを公開プレビューで行うため。
          if [ -n "$APP_PASSWORD" ]; then
            printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD --config wrangler-preview.toml 2>&1 | tail -2 || true
          else
            echo "::warning::HANSOKU_APP_PASSWORD 未設定。プレビューの個人ログイン（/join）は無効です。"
          fi
          [ -n "$url" ] && { echo "## 公開URL（認証なし）" >> "$GITHUB_STEP_SUMMARY"; echo "**$url**" >> "$GITHUB_STEP_SUMMARY"; }
