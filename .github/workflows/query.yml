name: 実績を集計して見る

# 本番の実績を画面から確認するための手動ワークフロー。
# DBクライアントを用意しなくても、任意の店舗×期間×指標で数字を出せる。

on:
  workflow_dispatch:
    inputs:
      metric:
        description: '指標'
        type: choice
        options:
          - sales
          - food_sales
          - drink_sales
          - food_purchase
          - drink_purchase
          - food_theory_cost
          - drink_theory_cost
          - cost_rate
          - dept_sales
          - dept_qty
          - product_sales
          - product_qty
          - product_cost
          - product_gross
        default: sales
      date_from:
        description: '開始日 YYYY-MM-DD'
        required: true
        default: '2026-01-01'
      date_to:
        description: '終了日 YYYY-MM-DD'
        required: true
        default: '2026-12-31'
      store:
        description: '店舗コード（空欄なら全店）'
        required: false
        default: ''
      source:
        description: '取り込み口を絞る（fw_sheet / fw_uriage_suii / pos_sheet）。空欄なら優先順位で1つ選ぶ'
        required: false
        default: ''
      group_by:
        description: '束ね方'
        type: choice
        options:
          - store_code
          - date
          - metric
        default: store_code
      inspect_sheet:
        description: '集計の代わりに、取り込み元シートのタブ一覧を出す'
        type: boolean
        default: false
      actual_cost:
        description: '集計の代わりに、実原価（棚卸＋仕入）が店×月でどれだけ出せているかを見る'
        type: boolean
        default: false
      month_from:
        description: '実原価の開始 YYYY-MM'
        required: false
        default: '2026-02'
      month_to:
        description: '実原価の終了 YYYY-MM'
        required: false
        default: '2026-08'
      sample_tabs:
        description: '中身を覗くタブ名（カンマ区切り。列構造の確認用）'
        required: false
        default: ''
      audit_cost:
        description: '集計の代わりに、損益（原価率）取込監査を全店で出す'
        type: boolean
        default: false
      audit_from:
        description: '損益監査の開始月 YYYY-MM（空=直近12ヶ月）'
        required: false
        default: ''
      audit_to:
        description: '損益監査の終了月 YYYY-MM（空=直近の完全月）'
        required: false
        default: ''
      probe_sheet:
        description: '集計の代わりに、FW共有シートの損益タブの年月カバレッジを出す（バックフィル手配用）'
        type: boolean
        default: false
      check_months:
        description: 'probe_sheet: 有無を確認する月（カンマ区切り YYYY-MM）'
        required: false
        default: '2025-09,2025-10,2025-11,2025-12'
      audit_categories:
        description: '集計の代わりに、品目区分の分類監査（誤分類・その他落ち）を出す'
        type: boolean
        default: false
      audit_store:
        description: 'audit_categories の対象店（既定 1160）'
        required: false
        default: '1160'

# トークンは読み取りだけでよい（どのワークフローも push もコメントもしない）。
permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 損益（原価率）取込監査
        if: ${{ inputs.audit_cost }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AUDIT_FROM: ${{ inputs.audit_from }}
          AUDIT_TO: ${{ inputs.audit_to }}
        run: |
          set -o pipefail
          python scripts/audit_cost.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 品目区分の分類監査
        if: ${{ inputs.audit_categories }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORE: ${{ inputs.audit_store }}
        run: |
          set -o pipefail
          python scripts/audit_categories.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: FW共有シート 損益タブの年月カバレッジ
        if: ${{ inputs.probe_sheet }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FW_SPREADSHEET_ID: ${{ secrets.FW_SPREADSHEET_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CHECK_MONTHS: ${{ inputs.check_months }}
        run: |
          set -o pipefail
          python scripts/probe_sheet_months.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 取り込み元シートのタブ一覧
        if: ${{ inputs.inspect_sheet && !inputs.audit_cost && !inputs.probe_sheet }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FW_SPREADSHEET_ID: ${{ secrets.FW_SPREADSHEET_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # tee で受けるので、パイプ途中の失敗を step の失敗として扱う。
          # これが無いと python がこけても tee の成功で success になる。
          set -o pipefail
          {
            echo '## 取り込み元シートのタブ一覧'
            echo ''
            echo '```'
            args=""
            for tab in $(echo "${{ inputs.sample_tabs }}" | tr ',' ' '); do
              args="$args --sample $tab"
            done
            python -m hansoku.cli sheet-tabs $args
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 実原価が出せている店×月
        if: ${{ inputs.actual_cost && !inputs.inspect_sheet }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          args="--month-from ${{ inputs.month_from }} --month-to ${{ inputs.month_to }}"
          [ -n "${{ inputs.store }}" ] && args="$args --store ${{ inputs.store }}"
          {
            echo '## 実原価（前月棚卸 ＋ 当月仕入 − 当月棚卸）'
            echo ''
            echo '```'
            python -m hansoku.cli actual-cost $args
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 集計
        if: ${{ !inputs.inspect_sheet && !inputs.audit_cost && !inputs.probe_sheet && !inputs.actual_cost && !inputs.audit_categories }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          args="--metric ${{ inputs.metric }} \
                --date-from ${{ inputs.date_from }} \
                --date-to ${{ inputs.date_to }}"
          [ -n "${{ inputs.store }}" ] && args="$args --store ${{ inputs.store }}"
          [ -n "${{ inputs.source }}" ] && args="$args --source ${{ inputs.source }}"
          args="$args --group-by ${{ inputs.group_by }}"
          # 実行結果はジョブのサマリにも残す（ログを掘らなくても読める）
          {
            echo '## 集計結果'
            echo ''
            echo "指標: \`${{ inputs.metric }}\` / 期間: ${{ inputs.date_from }} 〜 ${{ inputs.date_to }}"
            echo ''
            echo '```'
            python -m hansoku.cli aggregate $args
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
