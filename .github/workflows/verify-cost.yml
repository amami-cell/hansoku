name: verify-cost

# 原価の取り込み／表示を確認する（読み取りのみ）。合否は run の conclusion で判り、
# 実数は ::notice:: 注釈に出す（ログ/サマリは blob で手元から読めないため）。
#  mode=warehouse … 倉庫(Neon)の product_cost を店×月で合計し、しきい値で合否。
#  mode=dashboard … 配信中の dashboard.json の abc_cost[店][月] と品目区分の原価を見る。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "warehouse / dashboard / coverage / storedump / tperiod / dialog（目標ダイアログをブラウザで確認）"
        type: choice
        options: [warehouse, dashboard, coverage, storedump, tperiod, dialog]
        default: warehouse
      store:
        description: "店コード"
        required: true
        default: "1713"
      date_from:
        description: "[warehouse] 開始日 YYYY-MM-DD"
        required: false
        default: "2026-09-01"
      date_to:
        description: "[warehouse] 終了日 YYYY-MM-DD"
        required: false
        default: "2026-09-30"
      metric:
        description: "[warehouse] 指標"
        required: false
        default: "product_cost"
      min_expected:
        description: "[warehouse] この値以上なら合格"
        required: false
        default: "2000000"
      month:
        description: "[dashboard] 対象月 YYYY-MM"
        required: false
        default: "2026-09"
      url:
        description: "[dashboard] 対象URL"
        required: false
        default: "https://hansoku-app.amami-c1e.workers.dev/"
      period_from:
        description: "[tperiod] 目標数値期間 開始 YYYY-MM"
        required: false
        default: "2026-12"
      period_to:
        description: "[tperiod] 目標数値期間 終了 YYYY-MM"
        required: false
        default: "2027-01"
      camp:
        description: "[dialog] 施策id（例 r1097-bounenkai）"
        required: false
        default: "r1097-bounenkai"

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ inputs.mode == 'warehouse' || inputs.mode == 'coverage' || inputs.mode == 'storedump' || inputs.mode == 'dialog' }}
        with:
          python-version: "3.12"
          cache: pip
      - name: 依存パッケージをインストール
        if: ${{ inputs.mode == 'warehouse' || inputs.mode == 'coverage' || inputs.mode == 'storedump' || inputs.mode == 'dialog' }}
        run: pip install -r requirements.txt
      - name: ブラウザ（dialog用）
        if: ${{ inputs.mode == 'dialog' }}
        run: python -m playwright install --with-deps chromium

      - name: 倉庫の合計を出して注釈にする
        if: ${{ inputs.mode == 'warehouse' }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORE: ${{ inputs.store }}
          DF: ${{ inputs.date_from }}
          DT: ${{ inputs.date_to }}
          METRIC: ${{ inputs.metric }}
          MIN: ${{ inputs.min_expected }}
        run: |
          set -o pipefail
          OUT="$(python -m hansoku.cli aggregate --metric "$METRIC" \
                  --date-from "$DF" --date-to "$DT" --store "$STORE" --group-by date)"
          echo "$OUT"
          TOTAL="$(printf '%s\n' "$OUT" | sed -n 's/^合計 \([0-9,]*\).*/\1/p' | tr -d ',')"
          [ -n "$TOTAL" ] || TOTAL=0
          echo "::notice title=${STORE} ${DF}..${DT} ${METRIC}::合計=${TOTAL}（基準 ${MIN} 以上で合格）"
          if [ "$TOTAL" -ge "$MIN" ]; then
            echo "✅ 合格：合計 ${TOTAL} ≥ ${MIN}"
          else
            echo "::error title=verify-cost 不合格::合計 ${TOTAL} が基準 ${MIN} 未満"
            exit 1
          fi

      - name: 配信JSONの原価を出して注釈にする
        if: ${{ inputs.mode == 'dashboard' }}
        env:
          URL: ${{ inputs.url }}
          STORE: ${{ inputs.store }}
          MONTH: ${{ inputs.month }}
        run: |
          set -uo pipefail
          U="${URL%/}"
          curl -sS "$U/data/dashboard.json" -o d.json
          echo "dashboard.json bytes=$(wc -c < d.json | tr -d ' ')"
          # 店×月のABC実原価（原価率行に使う値）。
          AB="$(jq -c --arg s "$STORE" --arg m "$MONTH" '(.abc_cost[$s][$m]) // null' d.json)"
          echo "abc_cost[$STORE][$MONTH] = $AB"
          RATE="$(jq -r --arg s "$STORE" --arg m "$MONTH" '(.abc_cost[$s][$m].rate) // empty' d.json)"
          # 品目区分ごとのABC実原価（食べ飲み放題などのセル）。
          CATS="$(jq -r --arg s "$STORE" --arg m "$MONTH" \
            '[(.categories_monthly[$s][$m] // [])[] | select(.cost!=null) | "\(.name):原価\(.cost)/売上\(.cost_sales)"] | join(" / ")' d.json)"
          echo "品目区分の原価: $CATS"
          echo "::notice title=${STORE} ${MONTH} 店ABC原価率::${AB}"
          echo "::notice title=${STORE} ${MONTH} 区分別ABC原価::${CATS:-（なし）}"
          # 原価率が出ていれば合格（空＝abc_cost未配信なら不合格）。
          if [ -n "$RATE" ]; then
            echo "✅ 配信JSONに abc_cost あり：原価率 ${RATE}%"
          else
            echo "::error title=dashboard 不合格::abc_cost[${STORE}][${MONTH}] が配信JSONに無い"
            exit 1
          fi

      - name: 前年ABC（宴会・内訳）の全店カバレッジ
        if: ${{ inputs.mode == 'coverage' }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DF: ${{ inputs.date_from }}
          DT: ${{ inputs.date_to }}
          URL: ${{ inputs.url }}
        run: |
          set -o pipefail
          # 配信JSONは Cloudflare 越しなので curl で取る（python urllib だと 403）。
          if [ -n "${URL:-}" ]; then
            curl -sS "${URL%/}/data/dashboard.json" -o /tmp/dash.json || echo "curl失敗"
            echo "dash.json bytes=$(wc -c < /tmp/dash.json 2>/dev/null || echo 0)"
          fi
          python - <<'PY'
          import os, datetime as dt
          from hansoku.settings import load_settings
          from hansoku.stores import StoreMaster
          from hansoku.db import get_warehouse, AggregateQuery
          from hansoku.model import GRAIN_MONTH, METRIC_PRODUCT_SALES, METRIC_DEPT_SALES

          def _d(s, default):
              try:
                  y, m, d = (int(x) for x in s.split("-"))
                  return dt.date(y, m, d)
              except Exception:
                  return default

          df = _d(os.environ.get("DF", ""), dt.date(2025, 10, 1))
          dtt = _d(os.environ.get("DT", ""), dt.date(2026, 1, 31))
          # 対象月（df〜dtt の各月）。
          want = []
          y, m = df.year, df.month
          while (y, m) <= (dtt.year, dtt.month):
              want.append(f"{y:04d}-{m:02d}")
              m += 1
              if m > 12:
                  y += 1; m = 1

          settings = load_settings()
          master = StoreMaster.load(None)
          fw = [s.store_code for s in master.active if (getattr(s, "pos", None) or "fw") == "fw"]
          name = {s.store_code: s.store_name for s in master.active}

          def present(metric):
              seen = {}
              with get_warehouse(settings) as wh:
                  for row in wh.aggregate(AggregateQuery(
                          date_from=df, date_to=dtt, grain=GRAIN_MONTH, metrics=[metric],
                          store_codes=fw, group_by=("store_code", "date"))):
                      if row["value"] and row["value"] > 0:
                          seen.setdefault(row["store_code"], set()).add(row["date"].strftime("%Y-%m"))
              return seen

          ps = present(METRIC_PRODUCT_SALES)
          ds = present(METRIC_DEPT_SALES)
          bad = []
          for c in fw:
              miss_ps = [w for w in want if w not in ps.get(c, set())]
              miss_ds = [w for w in want if w not in ds.get(c, set())]
              if miss_ps or miss_ds:
                  bad.append(f"{c}{name.get(c,'')}:商品欠[{','.join(miss_ps) or '-'}]/部門欠[{','.join(miss_ds) or '-'}]")
          print(f"::notice title=前年ABCカバレッジ {want[0]}〜{want[-1]}::対象FW{len(fw)}店 / 完備{len(fw)-len(bad)}店 / 欠け{len(bad)}店")
          if not bad:
              print("::notice title=カバレッジ::全店そろっています")
          else:
              buf = ""; i = 0
              for b in bad:
                  if len(buf) + len(b) > 900:
                      i += 1; print(f"::notice title=欠けのある店{i}::{buf}"); buf = ""
                  buf += b + " / "
              if buf:
                  i += 1; print(f"::notice title=欠けのある店{i}::{buf}")

          # --- 部門グリッドが無い店の「宴会(コース)再構成」裏取り（配信JSON）---
          # FW生部門が無い店は商品→部門の再構成で departments を作る。配信中の
          # dashboard.json に コース バケットが売上つきで出ているかを店×月で確認する。
          recon_stores = ["1069", "1111", "1137", "1151", "1168"]
          if os.path.exists("/tmp/dash.json"):
              import json
              try:
                  with open("/tmp/dash.json", encoding="utf-8") as _f:
                      dash = json.load(_f)
                  dm = dash.get("departments_monthly", {})
                  for c in recon_stores:
                      per = dm.get(c, {}) or {}
                      cells = []
                      for w in want:
                          bks = (per.get(w, {}) or {}).get("buckets", []) or []
                          course = next((b for b in bks if b.get("name") == "コース"), None)
                          if course and (course.get("sales") or 0) > 0:
                              cells.append(f"{w}:コース{int(course['sales']):,}")
                          else:
                              anyb = "有" if bks else "無"
                              cells.append(f"{w}:コース無(部門{anyb})")
                      print(f"::notice title=宴会再構成 {c}{name.get(c,'')}::{' / '.join(cells)}")
              except Exception as e:
                  print(f"::warning title=再構成確認失敗::{e}")
          PY

      - name: 1店の前年商品実績（コース・食べ放題を抽出）
        if: ${{ inputs.mode == 'storedump' }}
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          STORE: ${{ inputs.store }}
          DF: ${{ inputs.date_from }}
          DT: ${{ inputs.date_to }}
        run: |
          set -o pipefail
          python - <<'PY'
          import os, datetime as dt, csv
          from hansoku.settings import load_settings
          from hansoku.db import get_warehouse, AggregateQuery
          from hansoku.model import (GRAIN_MONTH, METRIC_PRODUCT_SALES,
                                     METRIC_PRODUCT_QTY, METRIC_PRODUCT_COST)

          def _d(s, default):
              try:
                  y, m, d = (int(x) for x in s.split("-")); return dt.date(y, m, d)
              except Exception:
                  return default

          df = _d(os.environ.get("DF", ""), dt.date(2025, 10, 1))
          dtt = _d(os.environ.get("DT", ""), dt.date(2026, 1, 31))
          store = os.environ.get("STORE", "1151")
          settings = load_settings()

          def by(metric, keys=("product_name",)):
              agg = {}
              with get_warehouse(settings) as wh:
                  for row in wh.aggregate(AggregateQuery(
                          date_from=df, date_to=dtt, grain=GRAIN_MONTH, metrics=[metric],
                          store_codes=[store], group_by=keys)):
                      k = row["product_name"]
                      agg[k] = agg.get(k, 0) + (row["value"] or 0)
              return agg

          # 月別も取る（コース・食べ放題の前年・月別が忘年会目標に効く）。
          def by_month(metric):
              agg = {}
              with get_warehouse(settings) as wh:
                  for row in wh.aggregate(AggregateQuery(
                          date_from=df, date_to=dtt, grain=GRAIN_MONTH, metrics=[metric],
                          store_codes=[store], group_by=("product_name", "date"))):
                      m = row["date"].strftime("%Y-%m")
                      agg.setdefault(row["product_name"], {})[m] = agg.get(row["product_name"], {}).get(m, 0) + (row["value"] or 0)
              return agg

          sales = by(METRIC_PRODUCT_SALES)
          qty = by(METRIC_PRODUCT_QTY)
          cost = by(METRIC_PRODUCT_COST)
          salesM = by_month(METRIC_PRODUCT_SALES)
          names = set(sales) | set(qty) | set(cost)
          rows = sorted(((n, round(sales.get(n, 0)), round(qty.get(n, 0)), round(cost.get(n, 0)))
                         for n in names), key=lambda r: -r[1])
          want = []
          y, m = df.year, df.month
          while (y, m) <= (dtt.year, dtt.month):
              want.append(f"{y:04d}-{m:02d}"); m += 1
              if m > 12: y += 1; m = 1

          def kw(n, *ks): return any(k in n for k in ks)
          course = [r for r in rows if kw(r[0], "コース", "宴会")]
          tabe = [r for r in rows if kw(r[0], "放題")]
          tot_s = sum(r[1] for r in rows); tot_c = sum(r[3] for r in rows)
          print(f"::notice title={store} 前年商品実績 {want[0]}〜{want[-1]}::全{len(rows)}品 Σ売上{tot_s:,}(税込) / Σ原価{tot_c:,}")

          def emit(title, grp):
              gs = sum(r[1] for r in grp)
              # 月別内訳つきで上位を出す。
              lines = []
              for r in grp[:25]:
                  mm = salesM.get(r[0], {})
                  per = " ".join(f"{w[5:]}月{round(mm.get(w,0)):,}" for w in want if mm.get(w))
                  lines.append(f"{r[0]}:計{r[1]:,}({per})")
              print(f"::notice title={title}::{len(grp)}品 Σ売上{gs:,} :: " + " / ".join(lines) if grp
                    else f"::notice title={title}::該当なし（商品名に該当語なし）")

          emit(f"{store} コース系(コース/宴会)", course)
          emit(f"{store} 食べ放題系(放題)", tabe)

          os.makedirs("out", exist_ok=True)
          with open(f"out/{store}_前年商品実績.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["商品名", "売上計(税込)", "出数計", "原価計(税込)"] + [f"{x}売上" for x in want])
              for n, s, q, c in rows:
                  mm = salesM.get(n, {})
                  w.writerow([n, s, q, c] + [round(mm.get(x, 0)) for x in want])
          # 全商品を注釈にも分割出力（手元でCSV化できるように）。
          buf, part = "", 0
          for n, s, q, c in rows:
              line = f"{n}:{s:,}"
              if len(buf) + len(line) + 3 > 6000:
                  part += 1; print(f"::notice title={store}全商品{part:02d}::{buf}"); buf = ""
              buf += line + " / "
          if buf:
              part += 1; print(f"::notice title={store}全商品{part:02d}::{buf}")
          PY

      - name: CSVをアップロード
        if: ${{ inputs.mode == 'storedump' }}
        uses: actions/upload-artifact@v4
        with:
          name: storedump-${{ inputs.store }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      - name: 目標数値期間→前年110%薄字の本番確認
        if: ${{ inputs.mode == 'tperiod' }}
        env:
          URL: ${{ inputs.url }}
          STORE: ${{ inputs.store }}
          PF: ${{ inputs.period_from }}
          PT: ${{ inputs.period_to }}
          APP_PASSWORD: ${{ secrets.HANSOKU_APP_PASSWORD }}
        run: |
          set -uo pipefail
          U="${URL%/}"; FAIL=0; J="$(mktemp)"; KEY="zz-tperiod-check@2026"
          [ -n "${APP_PASSWORD:-}" ] || { echo "::error::APP_PASSWORD未設定"; exit 1; }

          echo "== 1) 合言葉ログイン =="
          code=$(curl -sS -c "$J" -o /dev/null -w "%{http_code}" \
            --data-urlencode "name=本部(期間確認)" --data-urlencode "password=$APP_PASSWORD" "$U/login" || echo 000)
          echo "login HTTP=$code (303=成功)"; [ "$code" = "303" ] || FAIL=1

          echo "== 2) デプロイ確認：配信app.jsに新ロジック(targetPeriodOf/×1.10)があるか =="
          curl -sS -b "$J" "$U/app.js" -o app.js || echo "app.js取得失敗"
          if grep -q "targetPeriodOf" app.js && grep -q "1\.10" app.js; then
            echo "✅ 新ロジックあり（デプロイ反映済み）"
          else
            echo "::error title=デプロイ未反映::配信app.jsに targetPeriodOf / ×1.10 が無い"; FAIL=1
          fi

          echo "== 3) 目標数値期間のAPI往復（保存→読み戻し→後始末）KEY=$KEY =="
          r1=$(curl -sS -b "$J" -X POST -H 'content-type: application/json' \
            -d "{\"id\":\"$KEY\",\"period_from\":\"$PF\",\"period_to\":\"$PT\"}" "$U/api/targets" || true)
          echo "save: $r1"; echo "$r1" | grep -q '"ok":true' || FAIL=1
          got=$(curl -sS "$U/api/targets" | jq -c --arg k "$KEY" '.target_periods[$k] // null')
          echo "readback: $got"
          if echo "$got" | jq -e --arg f "$PF" --arg t "$PT" '.from==$f and .to==$t' >/dev/null 2>&1; then
            echo "✅ 期間を保存・読み戻せた"
          else
            echo "::error title=API不合格::目標数値期間が読み戻せない"; FAIL=1
          fi
          curl -sS -b "$J" -X POST -H 'content-type: application/json' \
            -d "{\"id\":\"$KEY\",\"period_from\":\"\",\"period_to\":\"\"}" "$U/api/targets" >/dev/null && echo "後始末（期間解除）OK"

          echo "== 4) 薄字＝前年同期(目標数値期間)×110% の実数（店 $STORE）=="
          curl -sS "$U/data/dashboard.json" -o d.json
          pf_y=${PF%-*}; pf_m=${PF#*-}; pt_y=${PT%-*}; pt_m=${PT#*-}
          py_from="$((pf_y-1))-$pf_m"; py_to="$((pt_y-1))-$pt_m"
          echo "目標数値期間 $PF〜$PT → 前年同期 $py_from〜$py_to"
          sum=$(jq -r --arg s "$STORE" --arg a "$py_from" --arg b "$py_to" '
            [ (.departments_monthly[$s] // {}) | to_entries[] | select(.key>=$a and .key<=$b)
              | ((.value.buckets // [])[] | select(.name=="コース") | .sales) ] | add // 0' d.json)
          hint=$(awk "BEGIN{printf \"%d\", $sum*1.10}")
          echo "前年同期コース売上合計=$sum / 薄字(前年×110%)=$hint"
          echo "::notice title=$STORE 目標数値期間 $PF〜$PT::前年同期($py_from〜$py_to)コース売上=$sum → 薄字(前年×110%)=$hint"

          if [ "$FAIL" = "0" ]; then echo "✅ 本番確認OK"; else echo "❌ 失敗あり"; exit 1; fi

      - name: 目標ダイアログで目標数値期間→前年110%薄字が効くか（Playwright）
        if: ${{ inputs.mode == 'dialog' }}
        env:
          URL: ${{ inputs.url }}
          APP_PASSWORD: ${{ secrets.HANSOKU_APP_PASSWORD }}
          CAMP: ${{ inputs.camp }}
          PF: ${{ inputs.period_from }}
          PT: ${{ inputs.period_to }}
        run: |
          set -o pipefail
          xvfb-run -a python - <<'PY'
          import os, sys
          from playwright.sync_api import sync_playwright
          U = os.environ["URL"].rstrip("/")
          PWD = os.environ["APP_PASSWORD"]
          CAMP = os.environ.get("CAMP", "r1097-bounenkai")
          PF = os.environ.get("PF", "2026-12"); PT = os.environ.get("PT", "2027-01")
          fail = 0
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context()
              # 合言葉ログイン（APIRequestContext でクッキーを取得。303は追わない）
              r = ctx.request.post(U + "/login", form={"name": "本部(ダイアログ確認)", "password": PWD}, max_redirects=0)
              print("login status", r.status)
              page = ctx.new_page()
              page.goto(U + "/", wait_until="networkidle")
              page.wait_for_function("window.DATA && DATA.campaigns && DATA.campaigns.length>0", timeout=40000)
              opened = page.evaluate(
                  "(camp) => { const c = DATA.campaigns.find(x => x.id===camp || (typeof campKey==='function' && campKey(x)===camp+'@2026'));"
                  " if(!c) return {err:'campaign not found: '+camp};"
                  " try { openGoalGrid(c); } catch(e){ return {err:'open failed: '+e.message}; }"
                  " const sel=document.querySelector('#gg-rows .gr .gr-cat'); if(sel){ sel.value='sales'; sel.dispatchEvent(new Event('change',{bubbles:true})); }"
                  " return {ok:true, key: campKey(c)}; }", CAMP)
              print("open:", opened)
              if not opened or opened.get("err"):
                  print("::error title=dialog::" + str(opened)); b.close(); sys.exit(1)
              setr = page.evaluate(
                  "(a) => { const f=document.getElementById('gg-tpfrom'), t=document.getElementById('gg-tpto');"
                  " if(!f||!t) return {err:'no period inputs in dialog'};"
                  " f.value=a.pf; t.value=a.pt; t.dispatchEvent(new Event('change',{bubbles:true})); return {ok:true}; }",
                  {"pf": PF, "pt": PT})
              print("set:", setr)
              if not setr or setr.get("err"):
                  print("::error title=dialog::" + str(setr)); b.close(); sys.exit(1)
              page.wait_for_timeout(2500)
              read = page.evaluate(
                  "(a) => { const row=document.querySelector('#gg-rows .gr'); const inp=row&&row.querySelector('.gr-val'); const help=row&&row.querySelector('.gr-help');"
                  " const c = DATA.campaigns.find(x => x.id===a.camp || campKey(x)===a.camp+'@2026');"
                  " let expected=null; try { const tr=campTargeted(c,null,{from:shiftYear(a.pf,-1),to:shiftYear(a.pt,-1)}); expected = tr&&tr.cur>0 ? Math.round(tr.cur*1.10) : null; } catch(e){}"
                  " return { suggest: inp&&inp.dataset.suggest, placeholder: inp&&inp.placeholder, help: help&&help.textContent, cat: row&&row.querySelector('.gr-cat').value, expected: expected }; }",
                  {"camp": CAMP, "pf": PF, "pt": PT})
              print("read:", read)
              # 後始末：期間を空へ
              page.evaluate("() => { const f=document.getElementById('gg-tpfrom'),t=document.getElementById('gg-tpto'); if(f)f.value=''; if(t){t.value=''; t.dispatchEvent(new Event('change',{bubbles:true})); } }")
              page.wait_for_timeout(1500)
              b.close()
              sug = read.get("suggest"); exp = read.get("expected")
              print(f"::notice title={CAMP} ダイアログ薄字::区分={read.get('cat')} 薄字={sug} / 期待(前年同期×110%)={exp} / {read.get('help')}")
              try:
                  if sug is not None and exp is not None and int(float(sug)) == int(exp):
                      print("✅ ダイアログで目標数値期間→薄字＝前年同期×110% が一致")
                  else:
                      print(f"::error title=dialog不一致::薄字={sug} 期待={exp}"); fail = 1
              except Exception as e:
                  print(f"::error title=dialog判定失敗::{e}"); fail = 1
          sys.exit(fail)
