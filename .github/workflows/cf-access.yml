name: cf-access
# Cloudflare Access（前段SSO）を確認/変更する。
#   mode=probe  … いまのApplicationとポリシーを一覧（読み取りのみ・既定）
#   mode=any    … 「everyone を allow」ポリシーを足す＝サインインは残るが“どのアカウントでも”通す（B）
#   mode=public … 「everyone を bypass」＝サインインも不要の完全公開（A・全店売上が誰でも見える）
#   mode=delete … Application自体を削除（Workerの開放モードが全員に配信＝Aと同じ）
# 対象は host に一致する Application。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe / any / public / delete"
        required: false
        default: "probe"
      host:
        description: "対象ホスト（既定 hansoku.amami-c1e.workers.dev）"
        required: false
        default: "hansoku.amami-c1e.workers.dev"

permissions:
  contents: read

jobs:
  cf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Access編集用のトークンがあれば優先。無ければデプロイ用トークン（Access権限が無いと0件になる）。
      CF_ACCESS_TOKEN: ${{ secrets.CF_ACCESS_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
      MODE: ${{ github.event.inputs.mode }}
      HOST: ${{ github.event.inputs.host }}
    steps:
      - name: Access を確認/変更
        run: |
          set -uo pipefail
          RAW="${CF_ACCESS_TOKEN:-$CF_TOKEN}"
          TOK="$(printf '%s' "$RAW" | tr -d '[:space:]"'\''')"
          echo "使用トークン: $([ -n "${CF_ACCESS_TOKEN:-}" ] && echo CF_ACCESS_TOKEN || echo CLOUDFLARE_API_TOKEN)"
          api() { curl -sS -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" "$@"; }

          echo "== token 権限確認 =="
          api "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq '{success, errors}' || true

          # トークンが見られる全アカウントを列挙し、env の2つと合わせて重複排除して走査する。
          echo "== トークンが見られるアカウント一覧 =="
          accts_json="$(api "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          echo "$accts_json" | jq -r '.result[]? | "   \(.id)\t\(.name)"' || true
          API_ACCTS="$(echo "$accts_json" | jq -r '.result[]?.id' 2>/dev/null || true)"

          ACCT=""; APPID=""; BASE=""
          seen=""
          for a in $API_ACCTS "$CF_ACCOUNT" "$R2_ACCOUNT"; do
            aa="$(printf '%s' "$a" | tr -d '[:space:]"'\''')"
            [ -z "$aa" ] && continue
            case " $seen " in *" $aa "*) continue;; esac
            seen="$seen $aa"
            b="https://api.cloudflare.com/client/v4/accounts/$aa/access/apps"
            apps="$(api "$b?per_page=200")"
            ok="$(echo "$apps" | jq -r '.success')"
            n="$(echo "$apps" | jq -r '.result | length // 0' 2>/dev/null || echo 0)"
            echo "-- account ${aa:0:8}… : Access app ${n}件 / success=$ok"
            [ "$ok" != "true" ] && echo "   errors: $(echo "$apps" | jq -c '.errors')"
            echo "$apps" | jq -r '.result[]? | "   \(.id)\t\(.domain)\t\(.name)"' || true
            id="$(echo "$apps" | jq -r --arg h "$HOST" '.result[]? | select((.domain // "")|test($h)) | .id' | head -1)"
            if [ -n "$id" ] && [ "$id" != "null" ]; then ACCT="$aa"; APPID="$id"; BASE="$b"; fi
          done
          echo "対象アプリID: ${APPID:-（見つからない）}（account ${ACCT:0:8}…）"
          [ -z "${APPID:-}" ] && { echo "対象ホストの Access アプリが見つかりませんでした。"; exit 0; }

          echo "== 現在のポリシー =="
          api "$BASE/$APPID/policies" | jq -r '.result[]? | "\(.id)\t\(.decision)\t\(.name)"' || true

          if [ "$MODE" = "any" ]; then
            echo "== everyone を allow するポリシーを追加（サインインは残す＝B）=="
            api -X POST "$BASE/$APPID/policies" \
              --data '{"name":"allow-any-account","decision":"allow","include":[{"everyone":{}}]}' \
              | jq '{success, errors, result:{id:.result.id, decision:.result.decision}}'
            echo "→ 反映まで数十秒。サインインは出るが、どのアカウントでも通れば成功。"
          elif [ "$MODE" = "public" ]; then
            echo "== everyone を bypass するポリシーを追加（サインイン不要＝A）=="
            api -X POST "$BASE/$APPID/policies" \
              --data '{"name":"public-open","decision":"bypass","include":[{"everyone":{}}]}' \
              | jq '{success, errors, result:{id:.result.id, decision:.result.decision}}'
          elif [ "$MODE" = "delete" ]; then
            echo "== Application を削除（Workerの開放モードが全員に配信）=="
            api -X DELETE "$BASE/$APPID" | jq '{success, errors}'
          else
            echo "probe のみ。変更するなら mode=any（B）/ public（A）/ delete で再実行してください。"
          fi
