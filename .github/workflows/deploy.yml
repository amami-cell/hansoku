name: 画面をデプロイ

# Neon を集計して dashboard.json を書き出し、Cloudflare Pages へ公開する。
# 画面はこのJSONを読むだけで、表示時にDBを叩かない。

on:
  workflow_dispatch:
  schedule:
    # 毎日 11:00 JST (= 02:00 UTC)。実績の取り込み（10:30）の後に走らせる。
    - cron: '0 2 * * *'

# トークンは読み取りだけでよい（どのワークフローも push もコメントもしない）。
permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: スキーマを適用（promo_targets 等・冪等）
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # load_settings は cloud だと R2 も要求するため、書き出しと同じ環境を渡す
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$NEON_DATABASE_URL" ]; then
            python -m hansoku.cli init-schema
          else
            echo "::notice::NEON_DATABASE_URL 未設定のためスキーマ適用をスキップ"
          fi

      - name: 制作物PDFをR2へ揃える（冪等）
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m hansoku.cli creatives-sync

      - name: データを書き出す
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # 2025年の各月に前年比(=2024同月)を出すには2024年頭までデータが要る。
          # さらに2024年自身の前年比(=2023)や年間販促の複数年比較も見込み、37ヶ月遡る
          # （＝約3年。当年-前年-前々年が窓内に居る）。DBに無い月は自然に空になるだけ。
          FROM=$(date -d '-37 months' +%Y-%m-01)
          TO=$(date +%Y-%m-%d)
          python -m hansoku.cli export-web --date-from "$FROM" --date-to "$TO" --out web/data
          ls -la web/data

      - name: Cloudflare へ公開
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          APP_PASSWORD: ${{ secrets.HANSOKU_APP_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.HANSOKU_COOKIE_SECRET }}
        run: |
          set -o pipefail   # パイプの途中が失敗したら step も失敗させる
          # トークンに紛れ込みやすい前後の空白・改行・引用符を落とす。
          TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]\"'"'")"
          ACCOUNT="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]\"'"'")"
          # Worker（/api/targets）が使う @neondatabase/serverless を用意する。
          npm install
          npm install -g wrangler@4
          export CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT"

          # まず認証だけ検証する。ここで落ちればトークンの問題だと切り分けられる。
          echo "── トークンを検証 ──"
          if ! npx wrangler whoami 2>&1 | tee /tmp/who.log; then
            echo "::error::Cloudflare トークンの認証に失敗しました。トークンを作り直して CLOUDFLARE_API_TOKEN に貼り直してください（引用符や余分な文字が入らないように）。"
            exit 1
          fi

          # 制作物用の R2 バケットを用意（無ければ作る・冪等）。
          # Worker の CREATIVES バインドが実在バケットを要求するため、deploy の前に。
          echo "── R2バケットを用意 ──"
          npx wrangler r2 bucket create hansoku-creatives 2>&1 | tail -2 || \
            echo "（バケットは既存か、権限が無ければ deploy で検出されます）"

          echo "── 静的アセットのキャッシュ破棄（毎デプロイ一意化）──"
          sed -i "s/__BUILD__/$(date +%s)/g" web/index.html web/panel.html

          echo "── 公開 ──"
          npx wrangler deploy 2>&1 | tee /tmp/wr.log

          # 目標APIが使う Neon 接続文字列を Worker の秘密に入れる（毎回上書きで冪等）。
          if [ -n "$NEON_DATABASE_URL" ]; then
            echo "── DATABASE_URL を設定 ──"
            printf '%s' "$NEON_DATABASE_URL" | npx wrangler secret put DATABASE_URL 2>&1 | tail -2 || \
              echo "::warning::DATABASE_URL の設定に失敗。目標の保存(API)が使えない可能性があります。"
          else
            echo "::warning::NEON_DATABASE_URL 未設定。目標の保存(API)は無効です。"
          fi

          # 入口の合言葉。未設定なら Worker は「誰も入れない」に倒れる（開けっ放しにしない）。
          if [ -n "$APP_PASSWORD" ]; then
            echo "── APP_PASSWORD を設定 ──"
            printf '%s' "$APP_PASSWORD" | npx wrangler secret put APP_PASSWORD 2>&1 | tail -2 || \
              echo "::error::APP_PASSWORD の設定に失敗しました。"
          else
            echo "::warning::HANSOKU_APP_PASSWORD 未設定。Cloudflare Access が無いと誰も入れません。"
          fi

          # クッキーの署名鍵。合言葉とは別に持つ（合言葉を変えてもログアウトさせない／
          # 鍵を変えれば全員を一斉にログアウトさせられる）。
          if [ -n "$COOKIE_SECRET" ]; then
            echo "── COOKIE_SECRET を設定 ──"
            printf '%s' "$COOKIE_SECRET" | npx wrangler secret put COOKIE_SECRET 2>&1 | tail -2 || \
              echo "::error::COOKIE_SECRET の設定に失敗しました。"
          else
            echo "::warning::HANSOKU_COOKIE_SECRET 未設定。合言葉ログインは無効です。"
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wr.log | head -1 || true)
          if [ -n "$url" ]; then
            echo "## 公開URL" >> "$GITHUB_STEP_SUMMARY"
            echo "**$url**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pages 未設定のときの案内
        if: ${{ env.CF_TOKEN == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN 未設定のため公開はスキップしました。docs/deploy.md の手順で登録してください。"
