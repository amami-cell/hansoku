name: 画面をデプロイ

# Neon を集計して dashboard.json を書き出し、Cloudflare Pages へ公開する。
# 画面はこのJSONを読むだけで、表示時にDBを叩かない。

on:
  workflow_dispatch:
  schedule:
    # 毎日 11:00 JST (= 02:00 UTC)。実績の取り込み（10:30）の後に走らせる。
    - cron: '0 2 * * *'

env:
  TZ: Asia/Tokyo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: データを書き出す
        env:
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # 直近2年分。前年同月比に必要な範囲を含める。
          FROM=$(date -d '-13 months' +%Y-%m-01)
          TO=$(date +%Y-%m-%d)
          python -m hansoku.cli export-web --date-from "$FROM" --date-to "$TO" --out web/data
          ls -la web/data

      - name: Cloudflare へ公開
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler.toml の [assets] で web/ を静的サイトとして配る。
          # Cloudflare の画面でgit連携する必要はなく、ここから直接公開する。
          # トークンに紛れ込んだ前後の空白・改行を落とす（コピペ時に混入しやすい）。
          TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          ACCOUNT="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          npm install -g wrangler@4
          CLOUDFLARE_API_TOKEN="$TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT" \
            npx wrangler deploy 2>&1 | tee /tmp/wr.log
          # 発行されたURLをジョブのサマリに出す
          url=$(grep -oE 'https://[a-z0-9.-]+workers.dev' /tmp/wr.log | head -1 || true)
          if [ -n "$url" ]; then
            echo "## 公開URL" >> "$GITHUB_STEP_SUMMARY"
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pages 未設定のときの案内
        if: ${{ env.CF_TOKEN == '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN 未設定のため公開はスキップしました。docs/deploy.md の手順で登録してください。"
