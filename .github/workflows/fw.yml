name: FWから取り込む

# FW（Foodist Journal）に直接ログインして、日別売上・時間帯別売上・ABC分析を取る。
# 既存パイプライン（infomart_automation）には触らず、こちらは独立して動く。
#
# 画面は Angular の SPA で、セレクタが外れると何が起きたか分からなくなるため、
# スクリーンショットと画面構造を成果物として必ず残す。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '動作'
        type: choice
        options:
          - explore
          - list-stores
          - budget-probe
          - budget-dry
          - budget-ingest
          - daily-probe
          - report-probe
          - monthly-dry
          - monthly-ingest
          - hourly-dry
          - hourly-ingest
          - abc-dry
          - abc-ingest
          - abc-store-probe
          - lunch-analyze
          - hourly-store-probe
          - abc-totals-probe
          - menu-hourly-probe
          - abc-store-ingest
          - uriage-probe
          - abc-coverage
          - monthly-coverage
          - abc-detail
          - data-audit
          - source-audit
          - abc-dom-probe
          - manager-dl-probe
          - abc-campaign
          - gelato-switch
          - analysis-code-probe
          - analysis-code-audit
          - analysis-code-ingest
        default: explore
      runner:
        description: '実行環境: hosted=GitHub提供(無料枠を消費) / self-hosted=自前ランナー(枠を消費しない)'
        type: choice
        options:
          - hosted
          - self-hosted
        default: hosted
      abc_refresh:
        description: 'abc-campaign: 取込済みの過去回も取り直す (true/false)'
        required: false
        default: 'false'
      path:
        description: '探索するメニュー名（カンマ区切り）'
        required: false
        default: '販売管理'
      abc_store:
        description: 'abc-store-probe: 対象店名（部分一致）'
        required: false
        default: 'ぎふや 天満橋店'
      abc_from:
        description: 'abc-store-probe: 開始日 YYYY-MM-DD / monthly-coverage: 開始月 YYYY-MM'
        required: false
        default: '2026-08-01'
      abc_to:
        description: 'abc-store-probe: 終了日 YYYY-MM-DD / monthly-coverage: 終了月 YYYY-MM'
        required: false
        default: '2026-08-25'
      code_store:
        # ⚠️ abc_store は既定値が 'ぎふや 天満橋店' なので、**空を渡しても
        #    GitHubが既定値に戻す**。全店を指定する口が無かった（実際に
        #    「対象 1店」で終わった）。空を空のまま渡せる入力を分けて持つ。
        description: '分析用コードの点検: 店舗を1つに絞る（空なら全店）'
        required: false
        default: ''
      abc_levels:
        description: 'abc-store-probe: 出す分類（カンマ区切り。例 部門）'
        required: false
        default: ''
      abc_item:
        description: 'lunch-analyze: 開始日検出の新商品名の一部'
        required: false
        default: '冷やし鶏'
      abc_month:
        description: 'lunch-analyze: 対象月 MM'
        required: false
        default: '08'
      abc_end_day:
        description: 'lunch-analyze: 期間の終了日'
        required: false
        default: '25'
      hourly_store:
        description: 'hourly-store-probe: 対象店名（コンボ部分一致）'
        required: false
        default: 'NagaGutsu'
      hourly_ranges:
        description: 'hourly-store-probe: 期間 ラベル:from:to,... (YYYY-MM-DD)'
        required: false
        default: '基準:2026-08-01:2026-08-14,eタバコ後:2026-08-15:2026-08-16,空調後:2026-08-17:2026-08-23,新ランチ後:2026-08-24:2026-08-26'
      abc_ranges:
        description: 'abc-totals-probe: 期間 ラベル:from:to,... (YYYY-MM-DD)'
        required: false
        default: '基準:2026-08-01:2026-08-14,eタバコ後:2026-08-15:2026-08-16,空調後:2026-08-17:2026-08-23,新ランチ後:2026-08-24:2026-08-26'
      coverage_metric:
        description: 'monthly-coverage: 数える指標（sales / dept_sales / product_sales）'
        required: false
        default: 'sales'
      coverage_grain:
        description: 'monthly-coverage: 粒度（空=month。時間帯別の穴探しは hour）'
        required: false
        default: ''
      abc_ingest_month:
        description: 'abc-store-ingest: 対象月 YYYY-MM（既定は前月）。--abc-store に店コード or 店名'
        required: false
        default: '2026-07'
      budget_months:
        description: 'budget-ingest/dry: 当月から遡る月数（当月含む）'
        required: false
        default: '6'
      budget_ahead:
        description: 'budget-ingest/dry: 先付け予算を読む先の月数'
        required: false
        default: '6'
      budget_store:
        description: 'budget-ingest/dry: 1店だけ深く遡る（店コード or 店名の一部・空で全店）'
        required: false
        default: ''

# トークンは読み取りだけでよい（どのワークフローも push もコメントもしない）。
permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  fw:
    # hosted=GitHub提供(無料枠を消費) / self-hosted=自前ランナー(枠を消費しない)。
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    # 重いモード（gelato-switch=日別二分探索、abc-store-ingest=23ヶ月分の店別再取込、
    # abc-campaign=全施策再取込、hourly-ingest=全店×描画待ちリトライ）は30分では収まらない
    # ことがある。公開リポで無料枠は無制限のため、これらだけ余裕を持たせる（他は30分）。
    timeout-minutes: ${{ (inputs.mode == 'gelato-switch' || inputs.mode == 'abc-store-ingest' || inputs.mode == 'abc-campaign' || inputs.mode == 'hourly-ingest' || inputs.mode == 'analysis-code-audit' || inputs.mode == 'analysis-code-ingest') && 120 || 30 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Chromium本体をキャッシュ（毎回の数分DLを無くして無料枠を節約）。
      # self-hostedでは常設のブラウザが残るので実質DLゼロになる。
      - name: Playwrightブラウザをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-v1

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          # ブラウザ本体はキャッシュ/自前ランナーに在れば no-op（再DLしない）。
          python -m playwright install chromium
          # apt のシステム依存は hosted のときだけ（self-hostedは事前準備済み前提）。
          if [ "${{ inputs.runner }}" != "self-hosted" ]; then
            sudo python -m playwright install-deps chromium || python -m playwright install-deps chromium || true
          fi

      - name: Secrets の確認
        env:
          FW_USER: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FW_PASS: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
        run: |
          miss=""
          [ -z "$FW_USER" ] && miss="$miss FOODIST_JOURNAL_USER_ID"
          [ -z "$FW_PASS" ] && miss="$miss FOODIST_JOURNAL_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::未設定のSecrets:$miss"
            exit 1
          fi

      - name: 画面構造を調べる
        env:
          FOODIST_JOURNAL_USER_ID: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FOODIST_JOURNAL_PASSWORD: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # tee で受けるので、パイプ途中の失敗を step の失敗として扱う。
          # これが無いと取込がこけても tee の成功で success になる。
          set -o pipefail
          args=""
          for p in $(echo "${{ inputs.path }}" | tr ',' ' '); do
            args="$args --path $p"
          done
          # 既存パイプラインと同じく headless=False + xvfb で動かす
          {
            echo '## FW 画面構造'
            echo ''
            echo '```'
            if [ "${{ inputs.mode }}" = "list-stores" ]; then
              xvfb-run -a python -m hansoku.cli fw-stores --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode probe --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "manager-dl-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode manager-dl \
                --month "${{ inputs.abc_ingest_month }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode ingest --dry-run --limit 2 \
                --months "${{ inputs.budget_months }}" --ahead "${{ inputs.budget_ahead }}" \
                --store "${{ inputs.budget_store }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode ingest \
                --months "${{ inputs.budget_months }}" --ahead "${{ inputs.budget_ahead }}" \
                --store "${{ inputs.budget_store }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "daily-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode probe --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "report-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode report --menu "${{ inputs.path }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "monthly-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode monthly-dry --limit 2 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "monthly-ingest" ]; then
              M="${{ inputs.abc_ingest_month }}"
              if [ -n "$M" ]; then
                xvfb-run -a python -m hansoku.cli fw-daily --mode monthly --month "$M" --artifacts fw-artifacts
              else
                xvfb-run -a python -m hansoku.cli fw-daily --mode monthly --artifacts fw-artifacts
              fi
            elif [ "${{ inputs.mode }}" = "hourly-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode hourly-dry --limit 1 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "hourly-ingest" ]; then
              # abc_ingest_month を渡せば対象月を指定できる（既定＝前月。今月を明示したい時用）
              M="${{ inputs.abc_ingest_month }}"
              if [ -n "$M" ]; then
                xvfb-run -a python -m hansoku.cli fw-daily --mode hourly --month "$M" --artifacts fw-artifacts
              else
                xvfb-run -a python -m hansoku.cli fw-daily --mode hourly --artifacts fw-artifacts
              fi
            elif [ "${{ inputs.mode }}" = "abc-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-dry --limit 1 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-store-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-store-probe \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --abc-levels "${{ inputs.abc_levels }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "lunch-analyze" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode lunch-analyze \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-item "${{ inputs.abc_item }}" \
                --abc-month "${{ inputs.abc_month }}" \
                --abc-end-day "${{ inputs.abc_end_day }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "hourly-store-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode hourly-store-probe \
                --hourly-store "${{ inputs.hourly_store }}" \
                --hourly-ranges "${{ inputs.hourly_ranges }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-totals-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-totals-probe \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-ranges "${{ inputs.abc_ranges }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "menu-hourly-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode menu-hourly-probe \
                --hourly-store "${{ inputs.hourly_store }}" \
                --hourly-ranges "${{ inputs.hourly_ranges }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-store-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-store-ingest \
                --abc-store "${{ inputs.abc_store }}" \
                --month "${{ inputs.abc_ingest_month }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-campaign" ]; then
              # 登録済み販促の[start,end]レンジABCを施策id紐づけで取込（販売時期実績）
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-campaign \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-ids "${{ inputs.abc_item }}" \
                ${{ inputs.abc_refresh == 'true' && '--abc-refresh' || '' }} \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "gelato-switch" ]; then
              # TOジェラート ローテ各回の初売日を0円メニュー内訳の日別プローブで確定（DB書込なし・印字のみ）
              # abc_from/abc_to（YYYY-MM）で対象回を絞れる＝年ごと等に分割実行可能
              xvfb-run -a python -m hansoku.cli fw-daily --mode gelato-switch \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "uriage-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode uriage-probe \
                --month "${{ inputs.abc_ingest_month }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "monthly-coverage" ]; then
              python -m hansoku.cli fw-daily --mode monthly-coverage \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --metric "${{ inputs.coverage_metric }}" \
                --coverage-grain "${{ inputs.coverage_grain }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "source-audit" ]; then
              # FWログイン不要。同じ指標を複数の取り込み口が書いていないか調べる。
              python -m hansoku.cli fw-daily --mode source-audit \
                --metric "${{ inputs.coverage_metric }}" \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "data-audit" ]; then
              # FWログイン不要。貯まったデータ側からおかしな行を洗い出す。
              python -m hansoku.cli fw-daily --mode data-audit \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-detail" ]; then
              # FWログイン不要。対象月の部門・売れ筋をそのまま出す（台帳の bucket/items 決め用）
              python -m hansoku.cli fw-daily --mode abc-detail \
                --month "${{ inputs.abc_ingest_month }}" \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-item "${{ inputs.abc_item }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-coverage" ]; then
              python -m hansoku.cli fw-daily --mode abc-coverage \
                --month "${{ inputs.abc_ingest_month }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "analysis-code-audit" ]; then
              # 全店の分析用コードの入力漏れを調べ、あれば赤くする。DB書込なし。
              # ⚠️ この画面の『登録』『CSV取込』はマスタを書き換える。触らない。
              xvfb-run -a python -m hansoku.cli fw-daily --mode analysis-code-audit \
                --abc-store "${{ inputs.code_store }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "analysis-code-ingest" ]; then
              # 商品→分析用コードをCSVから読み、Neonに保存（下流の部門別客数用）。
              # FWには書かない（押すのは CSV出力 とダウンロードだけ）。
              # ⚠️ この画面の『登録』『CSV取込』はマスタを書き換える。触らない。
              xvfb-run -a python -m hansoku.cli fw-daily --mode analysis-code-ingest \
                --abc-store "${{ inputs.code_store }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "analysis-code-probe" ]; then
              # 分析用コード設定の画面を1店だけ見る診断。DB書込なし。
              # ⚠️ この画面の『登録』『CSV取込』はマスタを書き換える。触らない。
              xvfb-run -a python -m hansoku.cli fw-daily --mode analysis-code-probe \
                --abc-store "${{ inputs.code_store }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-dom-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-dom-probe \
                --abc-store "${{ inputs.abc_store }}" \
                --artifacts fw-artifacts
            else
              xvfb-run -a python -m hansoku.cli fw-explore $args --artifacts fw-artifacts
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 記録をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw-artifacts
          path: fw-artifacts/
          retention-days: 7
