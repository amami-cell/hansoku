name: FWから取り込む

# FW（Foodist Journal）に直接ログインして、日別売上・時間帯別売上・ABC分析を取る。
# 既存パイプライン（infomart_automation）には触らず、こちらは独立して動く。
#
# 画面は Angular の SPA で、セレクタが外れると何が起きたか分からなくなるため、
# スクリーンショットと画面構造を成果物として必ず残す。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '動作'
        type: choice
        options:
          - explore
          - list-stores
          - budget-probe
          - budget-dry
          - budget-ingest
          - daily-probe
          - report-probe
          - monthly-dry
          - monthly-ingest
          - hourly-dry
          - hourly-ingest
          - abc-dry
          - abc-ingest
          - abc-store-probe
          - lunch-analyze
        default: explore
      path:
        description: '探索するメニュー名（カンマ区切り）'
        required: false
        default: '販売管理'
      abc_store:
        description: 'abc-store-probe: 対象店名（部分一致）'
        required: false
        default: 'ぎふや 天満橋店'
      abc_from:
        description: 'abc-store-probe: 開始日 YYYY-MM-DD'
        required: false
        default: '2026-08-01'
      abc_to:
        description: 'abc-store-probe: 終了日 YYYY-MM-DD'
        required: false
        default: '2026-08-25'
      abc_item:
        description: 'lunch-analyze: 開始日検出の新商品名の一部'
        required: false
        default: '冷やし鶏'
      abc_month:
        description: 'lunch-analyze: 対象月 MM'
        required: false
        default: '08'
      abc_end_day:
        description: 'lunch-analyze: 期間の終了日'
        required: false
        default: '25'

env:
  TZ: Asia/Tokyo

jobs:
  fw:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Secrets の確認
        env:
          FW_USER: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FW_PASS: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
        run: |
          miss=""
          [ -z "$FW_USER" ] && miss="$miss FOODIST_JOURNAL_USER_ID"
          [ -z "$FW_PASS" ] && miss="$miss FOODIST_JOURNAL_PASSWORD"
          if [ -n "$miss" ]; then
            echo "::error::未設定のSecrets:$miss"
            exit 1
          fi

      - name: 画面構造を調べる
        env:
          FOODIST_JOURNAL_USER_ID: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FOODIST_JOURNAL_PASSWORD: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
          HANSOKU_ENV: cloud
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          args=""
          for p in $(echo "${{ inputs.path }}" | tr ',' ' '); do
            args="$args --path $p"
          done
          # 既存パイプラインと同じく headless=False + xvfb で動かす
          {
            echo '## FW 画面構造'
            echo ''
            echo '```'
            if [ "${{ inputs.mode }}" = "list-stores" ]; then
              xvfb-run -a python -m hansoku.cli fw-stores --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode probe --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode ingest --dry-run --limit 2 --months 2 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "budget-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-budget --mode ingest --months 3 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "daily-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode probe --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "report-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode report --menu "${{ inputs.path }}" --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "monthly-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode monthly-dry --limit 2 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "monthly-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode monthly --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "hourly-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode hourly-dry --limit 1 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "hourly-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode hourly --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-dry" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-dry --limit 1 --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-ingest" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "abc-store-probe" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode abc-store-probe \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-from "${{ inputs.abc_from }}" \
                --abc-to "${{ inputs.abc_to }}" \
                --artifacts fw-artifacts
            elif [ "${{ inputs.mode }}" = "lunch-analyze" ]; then
              xvfb-run -a python -m hansoku.cli fw-daily --mode lunch-analyze \
                --abc-store "${{ inputs.abc_store }}" \
                --abc-item "${{ inputs.abc_item }}" \
                --abc-month "${{ inputs.abc_month }}" \
                --abc-end-day "${{ inputs.abc_end_day }}" \
                --artifacts fw-artifacts
            else
              xvfb-run -a python -m hansoku.cli fw-explore $args --artifacts fw-artifacts
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 記録をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fw-artifacts
          path: fw-artifacts/
          retention-days: 7
